---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-job:
    name: Flate Pre-Job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: kubernetes/**

  test:
    name: Flate Test
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # base is emptied on purpose. The action exports FLATE_BASE unconditionally
      # and defaults it to the default branch, which `flate test` then reads
      # from the environment and switches to changed-only mode over -- against
      # a rev this shallow checkout does not have:
      #   flate error: could not resolve --base="main": not found locally or as origin/main
      # Testing the whole tree is also what is wanted here rather than only the
      # changed resources, since a change in one app can break the render of
      # another, and the full pass takes about two seconds.
      - name: Install Flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""
          cache: true

      - name: Run Flate Test
        run: flate test all --path ./kubernetes/flux/cluster --no-progress

  flate-status:
    name: Flate Success
    needs:
      - "test"
    runs-on: ubuntu-latest
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
