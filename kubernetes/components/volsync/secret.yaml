---
# Contains no secrets. Every value is a Flux substitution filled in at apply
# time from cluster-secrets, which is the only place the rustfs credentials and
# the restic passphrase are stored. That is what makes this a component rather
# than a file to be copied and edited per app.
#
# The repository path is derived from ${APP}, so each app gets its own restic
# repository. They cannot share one: VolSync hardcodes the restic host to
# "volsync" for every mover, so a shared repository would apply one retention
# policy across all apps at once and silently drop other apps' snapshots.
apiVersion: v1
kind: Secret
metadata:
  name: "${APP}-volsync-restic"
type: Opaque
stringData:
  RESTIC_REPOSITORY: "s3:${VOLSYNC_S3_ENDPOINT}/${VOLSYNC_BUCKET:=twenty-volumes}/${APP}"
  RESTIC_PASSWORD: "${VOLSYNC_RESTIC_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${VOLSYNC_AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${VOLSYNC_AWS_SECRET_ACCESS_KEY}"
