---
# WAL archiving is continuous once the plugin is attached; this is the periodic
# base backup that WAL is replayed on top of. Without one, archived WAL has
# nothing to recover from.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: "${APP}"
spec:
  # Six fields: CNPG schedules include seconds.
  schedule: "${CNPG_BACKUP_SCHEDULE:=0 0 2 * * *}"
  backupOwnerReference: self
  cluster:
    name: "postgres-${APP}"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: "${APP}"
