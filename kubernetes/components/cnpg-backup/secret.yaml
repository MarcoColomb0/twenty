---
# No secrets here -- every value is a Flux substitution resolved at apply time
# from cluster-secrets, the same way the volsync component works.
#
# These are the same rustfs credentials the volume backups use. One credential
# was issued with a policy covering both buckets, so there is nothing separate
# to rotate or keep in step; the variables keep their VOLSYNC_ names rather than
# being duplicated under a second set that would drift.
apiVersion: v1
kind: Secret
metadata:
  name: "${APP}-barman-s3"
type: Opaque
stringData:
  ACCESS_KEY_ID: "${VOLSYNC_AWS_ACCESS_KEY_ID}"
  ACCESS_SECRET_KEY: "${VOLSYNC_AWS_SECRET_ACCESS_KEY}"
