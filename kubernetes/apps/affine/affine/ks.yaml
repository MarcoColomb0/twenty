---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: affine
spec:
  dependsOn:
    # Reads postgres-affine-app, which CNPG publishes beside the Cluster in
    # this namespace.
    - name: affine-db
      namespace: affine
  interval: 1h
  path: ./kubernetes/apps/affine/affine/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: affine
  wait: false
