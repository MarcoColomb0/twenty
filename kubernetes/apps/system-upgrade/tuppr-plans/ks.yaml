---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-plans
spec:
  dependsOn:
    # the CRDs these resources use ship with the chart
    - name: tuppr
      namespace: system-upgrade
  interval: 1h
  path: ./kubernetes/apps/system-upgrade/tuppr-plans/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: system-upgrade
  wait: false
