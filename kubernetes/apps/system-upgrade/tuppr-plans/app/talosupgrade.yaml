---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # Kept in step with talos/talenv.yaml by the same Renovate annotation, so a
    # merged installer bump is what actually starts a rollout. Set to the running
    # version on first deploy, which makes applying this a no-op.
    #
    # tuppr upgrades to exactly this version and does NOT enforce Talos's
    # supported upgrade path -- stepping through minor releases is on us.
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.10
  # Force delete rather than evict. Longhorn keeps a PodDisruptionBudget on each
  # instance-manager at allowed=0 for as long as any volume is attached to that
  # node, and those volumes only detach once their pods are gone -- which the
  # drain is what does. Eviction cannot break that circle: the drain fails on the
  # instance-manager, tuppr rolls the cordon back, the pods reschedule onto the
  # node again, and it repeats every 12s indefinitely. Three rollouts stalled
  # here, each cleared by deleting pods and PVCs by hand.
  #
  # The cost is that this bypasses every PodDisruptionBudget, including CNPG's
  # -primary ones. A force-deleted primary is an ungraceful failover rather than
  # a switchover -- equivalent to the node crashing, which CNPG already handles,
  # and WAL is archived continuously so nothing is lost. waitForVolumeDetach
  # below still holds the reboot until the volumes have actually detached.
  #
  # spec.drain is marked deprecated in favour of "Talos policy drain
  # configuration", but spec.policy exposes only nodrain -- there is no eviction
  # control there yet, so this is the only field that does it.
  drain:
    enabled: true
    disableEviction: true
  policy:
    # Longhorn volumes are ReadWriteOnce. A fast reboot can orphan the mount and
    # pin the volume to the old node, which surfaces later as a Multi-Attach
    # error when the pod reschedules. This drains and waits for CSI volumes to
    # detach first.
    waitForVolumeDetach: true
  healthChecks:
    # Gate every node on the cluster being whole first. With three nodes the
    # rollout can afford to stop and wait rather than push on.
    - apiVersion: v1
      kind: Node
      expr: status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
    # And on Longhorn having finished rebuilding from the previous node's reboot.
    # "unknown" is what a detached volume reports and is normal; "degraded" means
    # a replica is still rebuilding, which is exactly when not to reboot the next
    # node.
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      expr: status.robustness in ["healthy", "unknown"]
      timeout: 30m
