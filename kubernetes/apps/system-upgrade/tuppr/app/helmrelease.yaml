---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  values:
    # The chart creates the talos.dev/v1alpha1 ServiceAccount that makes Talos
    # mint the talosconfig Secret this controller mounts. It only works because
    # patches/controller/machine-features.yaml grants os:admin to this namespace.
    talosServiceAccount:
      create: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
