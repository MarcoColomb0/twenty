---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
spec:
  dependsOn:
    # DATABASE_URL comes from the CNPG-generated postgres-miniflux-app Secret
    - name: miniflux-db
      namespace: miniflux
  interval: 1h
  path: ./kubernetes/apps/miniflux/miniflux/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: miniflux
  wait: false
