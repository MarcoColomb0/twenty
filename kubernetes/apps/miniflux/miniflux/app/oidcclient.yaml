---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: miniflux
spec:
  callbackUrls:
    - https://miniflux.${SECRET_DOMAIN}/oauth2/oidc/callback
  logoutCallbackUrls:
    - https://miniflux.${SECRET_DOMAIN}
  pkceEnabled: true
  skipConsent: true
  secret:
    name: miniflux-oidc
    keys:
      clientID: client_id
      clientSecret: client_secret
