# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-miniflux
spec:
  instances: 2
  # A database that fills its volume stops accepting writes, which is the
  # failure pvc-autoresizer exists to prevent -- and unlike the app volumes,
  # these grow on their own without anyone touching them. Currently 0.62G of
  # 2Gi per instance.
  #
  # inheritedMetadata is the only hook CNPG offers here: it stamps every object
  # it creates for the Cluster, PVCs included. Services and pods pick the
  # annotation up too, where it means nothing and costs nothing.
  inheritedMetadata:
    annotations:
      resize.topolvm.io/storage_limit: 10Gi
      resize.topolvm.io/threshold: 20%
      resize.topolvm.io/increase: 20%
  storage:
    size: 2Gi
    storageClass: longhorn
  # Continuous WAL archiving. The ScheduledBackup takes base backups; this is
  # what lets recovery land between them rather than only on one.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: "miniflux"
  # Without this the pods are BestEffort, which is the first thing the kubelet
  # evicts under node memory pressure -- so the database tier would be killed
  # before any of the apps in front of it. Requests below the limit rather than
  # equal to it, matching immich-db: a Postgres pinned at
  # request==limit is OOMKilled on a spike, and for a primary that is a
  # failover. Observed use here is 122-147Mi per instance.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
