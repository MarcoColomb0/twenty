---
# Collabora's admin console credential.
#
# The console lives at /browser/dist/admin/admin.html and exposes running
# documents, connected clients and server settings. It is not published --
# Collabora is on the internal gateway -- but it is still reachable from the LAN
# and the tailnet, so it gets a real password rather than the upstream example.
#
# The username is the plain value `admin` in the HelmRelease; only the password
# is secret.
#
# Generate:
#
#   openssl rand -base64 32
#
# then `sops kubernetes/apps/oxicloud/collabora/app/secret.sops.yaml`.
#
# reloader.stakater.com/auto is on the Deployment, so the pod restarts itself
# once this changes.
apiVersion: v1
kind: Secret
metadata:
  name: collabora-secret
type: Opaque
stringData:
  ADMIN_PASSWORD: ENC[AES256_GCM,data:5DT2UtZ9IJztZz9jNxCeGiGs/JEdc4Z9NQ6Vz9QnzY1tW35niZttNZ9ymFk=,iv:3C2pf++wPPfPLvZfWAhMqSLrIu7f2Zsorjc9I8rpFpc=,tag:cPmfkOIYWLwNT6JeZQRILg==,type:str]
