---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
spec:
  chartRef:
    kind: OCIRepository
    name: collabora
  interval: 1h
  values:
    controllers:
      collabora:
        # Same Sablier group as oxicloud -- see the comment there for why the
        # two cannot be woken independently, and why these are the legacy
        # `sablier.*` keys rather than the documented `sablierapp.dev/*` ones.
        labels:
          sablier.enable: "true"
          sablier.group: oxicloud
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/collabora/code
              tag: 26.04.4.2.1
            env:
              # The WOPI host allowlist. Collabora refuses to open a document
              # for any host not named here, which is the control that stops a
              # stranger pointing their own WOPI server at this editor and
              # using it as an open document-conversion service.
              #
              # Collabora matches this as a regex, so the dots are technically
              # wildcards. Left unescaped rather than half-escaped: the domain
              # arrives through ${SECRET_DOMAIN} and Flux would not escape the
              # dot inside it, so writing \. by hand only tightens the one dot
              # that happens to be typed here. An unescaped dot still matches a
              # literal dot -- it just also matches "driveXmarcoYwf", which
              # nobody can obtain a certificate for and which cannot reach this
              # service anyway, since it is on the internal gateway.
              #
              # Both entries are the same OxiCloud, which is what an alias
              # *group* is for. The second one is not optional: WOPISrc carries
              # OXICLOUD_WOPI_BASE_URL, which is the in-cluster service so the
              # editor's callbacks never leave the pod network -- and Collabora
              # validates that host against this list before it will open
              # anything:
              #   No authorized hosts found matching the target host
              #   [oxicloud.oxicloud.svc.cluster.local] in config
              # With only the public name listed the iframe loads and then sits
              # at a bare status bar, because the document never arrives.
              aliasgroup1: https://drive.${SECRET_DOMAIN}:443,http://oxicloud.oxicloud.svc.cluster.local:8086
              server_name: collabora.${SECRET_DOMAIN}
              # ssl.termination: Envoy terminates TLS and speaks plaintext to
              # the pod. Without it the generated URLs come back as http:// and
              # the browser blocks them as mixed content.
              #
              # net.frame_ancestors: Collabora sends a Content-Security-Policy
              # naming who may embed it, and by default that is only itself:
              #   frame-ancestors collabora.${SECRET_DOMAIN}:*
              # The editor is an iframe inside OxiCloud, so the browser refused
              # the frame and Chrome reported it as "refused to connect" --
              # indistinguishable from the host being unreachable, which is what
              # makes this one slow to spot. Adding the OxiCloud host appends to
              # the directive rather than replacing it:
              #   frame-ancestors drive.${SECRET_DOMAIN}:* collabora.${SECRET_DOMAIN}:*
              #
              # Deliberately the one host, not `https://*`: this directive is
              # the control that stops any other site embedding the editor and
              # driving it with a victim's session.
              extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:net.frame_ancestors=drive.${SECRET_DOMAIN}:*
              username: admin
              password:
                valueFrom:
                  secretKeyRef:
                    name: collabora-secret
                    key: ADMIN_PASSWORD
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /hosting/discovery
                    port: &port 9980
                  initialDelaySeconds: 0
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /hosting/discovery
                    port: *port
                  # It forks a pool of LibreOffice children at boot, which is
                  # slower than the HTTP listener coming up.
                  initialDelaySeconds: 15
                  periodSeconds: 5
                  failureThreshold: 40
            securityContext:
              allowPrivilegeEscalation: false
              # Everything dropped except MKNOD, which coolwsd needs to build
              # the chroot jails each document is rendered inside. That jail is
              # Collabora's own sandbox, so removing the capability to satisfy
              # a blanket drop-ALL would trade a real isolation boundary for a
              # cosmetic one.
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "MKNOD"
              # Not readOnlyRootFilesystem: coolwsd builds the jail trees under
              # /opt/cool at runtime and writes rendered tiles and per-document
              # scratch as it goes.
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              # One LibreOffice child per open document, on top of the base
              # pool. This is the ceiling for a household, not a target.
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        # 1001, which is what the image itself declares (`User: "1001"` in its
        # config blob) and what owns /opt/cool. Running as anything else fails
        # before the HTTP listener is up, because coolwsd builds a chroot jail
        # per document under a tree it then cannot write:
        #   Failed to initialize COOLWSD: filesystem error:
        #   cannot create directories: Permission denied
        #   [/opt/cool/child-roots/1-56594D07/systmp]
        # No fsGroup -- there is no volume here to own.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        # Internal only, deliberately. The browser has to reach the editor --
        # it is an iframe, not a server-to-server call -- so this is the one
        # piece that cannot live entirely inside the cluster. Putting it on the
        # internal gateway means the editor, its websocket endpoints and the
        # admin console at /browser/dist/admin/ are reachable over the LAN and
        # the tailnet and nowhere else, while OxiCloud itself stays published.
        #
        # The cost: editing works from a device on the LAN or the tailnet, not
        # from an arbitrary browser on the internet. Moving this to
        # envoy-external is a one-line change if that trade stops being worth
        # it -- but then the admin console is published too.
        hostnames:
          - "collabora.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
