---
# OxiCloud's JWT signing secret.
#
# Left unset, OxiCloud generates one at first boot and writes it to
# <STORAGE_PATH>/.jwt_secret. That works, but it couples every session to a
# dotfile on the blob volume: restoring that volume from a VolSync snapshot
# taken before the file existed would rotate the secret silently and log
# everyone out. Setting it explicitly keeps it with the other secrets.
#
# Rotating it invalidates every active session. It does not lose data.
#
# Generate:
#
#   openssl rand -hex 64
#
# then `sops kubernetes/apps/oxicloud/oxicloud/app/secret.sops.yaml`.
#
# reloader.stakater.com/auto is on the Deployment, so the pod restarts itself
# once this changes.
apiVersion: v1
kind: Secret
metadata:
  name: oxicloud-secret
type: Opaque
stringData:
  OXICLOUD_JWT_SECRET: ENC[AES256_GCM,data:COLskLg/rOJkN7MqnnquE9CdnjJkY8AoUhXFyV89lGM=,iv:IVztfT2Q5v2Ox8KNn5sp6TxfRGxEsaJRSe7VXGLjZc4=,tag:BOluYhtGjc4ll/08Ju61UQ==,type:str]
sops:
  age:
    - enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBBYklGcnV5dGE2SHR6Vy85
        V2xuQzdhWFJqOWthaDlQTC9odW4rUmcrYlV3CnU3OTJOYzBTU2pjS1pFR1dsTGVB
        Q055ZEY2N3JRVUhuK2F6U1MxYVVhdG8KLS0tIFBoYWhndUZ1TkhlRU03VXJDQzlx
        KzlDZ3dGRTlST1lxVEhlQitTeGp1aVkKV9T3zaMvtcz6lvKp2tsmiFGtARm4zBiR
        dUcrLQHOajti7wNmugIq2etnVG0YJgQZfT9/+Y9q64wdshxjZWKU9Q==
        -----END AGE ENCRYPTED FILE-----
      recipient: age1txcyeza70lxefaz3m45jxyf074czteej3z843js7z9fh8ndv5pxqll2tex
  encrypted_regex: ^(data|stringData)$
  lastmodified: "2026-09-18T20:11:18Z"
