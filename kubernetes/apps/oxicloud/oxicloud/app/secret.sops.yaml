---
# OxiCloud's signing secrets.
#
# OXICLOUD_JWT_SECRET signs every session. Left unset, OxiCloud generates one at
# first boot and writes it to <STORAGE_PATH>/.jwt_secret -- which works, but
# couples every session to a dotfile on the blob volume: restoring that volume
# from a VolSync snapshot taken before the file existed would rotate the secret
# silently and log everyone out. Set explicitly so it lives with the rest.
#
# OXICLOUD_WOPI_SECRET signs the short-lived tokens Collabora presents back to
# OxiCloud's /wopi/* endpoints. It defaults to the JWT secret when unset; given
# its own value so the two can be rotated independently, and so a WOPI token
# that leaks out of an iframe URL cannot be replayed as a session token.
#
# Rotating either invalidates tokens, not data.
#
# Generate both:
#
#   openssl rand -hex 64
#
# then `sops kubernetes/apps/oxicloud/oxicloud/app/secret.sops.yaml`.
#
# reloader.stakater.com/auto is on the Deployment, so the pod restarts itself
# once this changes.
apiVersion: v1
kind: Secret
metadata:
  name: oxicloud-secret
type: Opaque
stringData:
