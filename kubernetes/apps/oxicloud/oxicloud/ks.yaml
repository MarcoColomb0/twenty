---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oxicloud
spec:
  dependsOn:
    # Reads postgres-oxicloud-app, which CNPG publishes beside the Cluster.
    - name: oxicloud-db
      namespace: oxicloud
  interval: 1h
  path: ./kubernetes/apps/oxicloud/oxicloud/app
  postBuild:
    substitute:
      APP: oxicloud
      VOLSYNC_CLAIM: oxicloud-storage
      VOLSYNC_SCHEDULE: "0 8 * * *"
      VOLSYNC_CACHE_CAPACITY: 4Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: oxicloud
  wait: false
