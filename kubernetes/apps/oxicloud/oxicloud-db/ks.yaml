---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oxicloud-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/oxicloud/oxicloud-db/app
  postBuild:
    substitute:
      APP: oxicloud
      CNPG_BACKUP_SCHEDULE: "0 0 3 * * *"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: oxicloud
  wait: true
