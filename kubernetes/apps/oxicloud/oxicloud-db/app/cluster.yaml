# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-oxicloud
spec:
  instances: 2
  # File and folder metadata, users, shares, calendars and contacts. The file
  # bytes themselves live on the PVC, not here.
  inheritedMetadata:
    annotations:
      resize.topolvm.io/storage_limit: 20Gi
      resize.topolvm.io/threshold: 20%
      resize.topolvm.io/increase: 20%
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: "oxicloud"
  bootstrap:
    initdb:
      database: oxicloud
      owner: oxicloud
