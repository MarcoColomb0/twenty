---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dispatcharr
spec:
  chartRef:
    kind: OCIRepository
    name: dispatcharr
  interval: 1h
  timeout: 15m
  values:
    controllers:
      dispatcharr:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          dnsPolicy: None
          dnsConfig:
            nameservers:
              - 127.0.0.1
            options:
              - name: ndots
                value: "1"
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: twenty-hp01
        initContainers:
          vpn:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            restartPolicy: Always
            env:
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: wireguard
              WIREGUARD_IMPLEMENTATION: kernelspace
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: 25s
              PUBLICIP_ENABLED: "off"
              BLOCK_MALICIOUS: "off"
              FIREWALL_INPUT_PORTS: "9191"
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16
              HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
              VERSION_INFORMATION: "off"
            envFrom:
              - secretRef:
                  name: dispatcharr-vpn
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "/gluetun-entrypoint"
                      - "healthcheck"
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 24
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "/gluetun-entrypoint"
                      - "healthcheck"
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "NET_ADMIN"
                  - "NET_BIND_SERVICE"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.34.1
            env:
              DISPATCHARR_ENV: aio
              DISPATCHARR_PORT: &port 9191
              DISPATCHARR_LOG_LEVEL: info
              DISPATCHARR_TRUSTED_PROXIES: 10.42.0.0/16
              REDIS_HOST: localhost
              CELERY_BROKER_URL: redis://localhost:6379/0
              PUID: "1000"
              PGID: "1000"
              UWSGI_WORKERS: "2"
              CELERY_MAX_WORKERS: "2"
              LIBVA_DRIVER_NAME: iHD
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "curl"
                      - "-fsS"
                      - "-o"
                      - "/dev/null"
                      - "http://localhost:9191/"
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "curl"
                      - "-fsS"
                      - "-o"
                      - "/dev/null"
                      - "http://localhost:9191/"
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "FOWNER"
                  - "FSETID"
                  - "SETUID"
                  - "SETGID"
                  - "KILL"
                  - "AUDIT_WRITE"
            resources:
              requests:
                cpu: 100m
                gpu.intel.com/i915: 1
              limits:
                memory: 3Gi
                gpu.intel.com/i915: 1
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    persistence:
      gluetun-tmp:
        type: emptyDir
        advancedMounts:
          dispatcharr:
            vpn:
              - path: /tmp/gluetun
      data:
        existingClaim: dispatcharr-data
        advancedMounts:
          dispatcharr:
            app:
              - path: /data
      db:
        existingClaim: dispatcharr-db
        advancedMounts:
          dispatcharr:
            app:
              - path: /data/db
                subPath: db
    service:
      app:
        controller: dispatcharr
        clusterIP: 10.43.0.91
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "dispatcharr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
