---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sure
spec:
  callbackUrls:
    - https://sure.${SECRET_DOMAIN}/auth/openid_connect/callback
  logoutCallbackUrls:
    - https://sure.${SECRET_DOMAIN}
  pkceEnabled: true
  skipConsent: true
  # This is the actual access list, and it is load-bearing rather than
  # defence in depth. Sure's AUTH_JIT_MODE defaults to "create_and_link":
  # an SSO identity with no matching user gets a new user *and a new family*
  # created for it. The first account created also becomes super_admin. So
  # every identity Pocket ID lets through would otherwise get an account on a
  # publicly reachable finance app -- the same shape as the Vaultwarden SSO
  # signup path. Group membership is what stops the authorization code being
  # issued in the first place.
  allowedUserGroups:
    - name: sure-users
  secret:
    name: sure-oidc
    keys:
      clientID: client_id
      clientSecret: client_secret
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: sure-users
spec:
  friendlyName: Sure Users
