---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sure
spec:
  chartRef:
    kind: OCIRepository
    name: sure
  interval: 1h
  values:
    controllers:
      sure:
        # Rails and Sidekiq share /rails/storage -- Active Storage writes
        # uploads from the web request and the worker reads them back -- so they
        # are two containers in one pod rather than two Deployments. A
        # ReadWriteOnce Longhorn volume could not be mounted by both otherwise,
        # and that also makes a rolling update deadlock on the attach.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # db:prepare creates the schema on an empty database and migrates an
          # existing one, so it covers both first boot and every upgrade.
          # DISABLE_DATABASE_ENVIRONMENT_CHECK is what lets it run against a
          # database Rails did not create itself -- here CNPG's initdb did.
          migrate:
            image: &image
              repository: ghcr.io/we-promise/sure
              tag: 0.7.4
            command:
              - "sh"
              - "-c"
              # The mkdir is what makes TMPDIR below usable -- see the comment
              # on the env var. It runs here because this is the first
              # container in the pod and the emptyDir outlives it, so the app
              # and worker find the directory already there.
              - "mkdir -p /tmp/ruby && chmod 700 /tmp/ruby && DISABLE_DATABASE_ENVIRONMENT_CHECK=1 bundle exec rake db:prepare"
            envFrom: &envFrom
              - secretRef:
                  name: sure-secret
            env: &env
              RAILS_ENV: production
              SELF_HOSTED: "true"
              # Ruby's Dir.tmpdir refuses a world-writable directory that has
              # no sticky bit, and rejects the whole boot in
              # config/application.rb before any of the app loads:
              #   system temporary path is world-writable: /tmp
              #   ArgumentError: could not find a temporary directory
              # An emptyDir is created 0777 owned by root (drwxrwsrwx), so it
              # fails that test, and a container running as 1000 cannot chmod
              # +t a directory root owns. A subdirectory it creates itself is
              # 0700 and owned by 1000, which passes -- hence the mkdir in the
              # init container above.
              TMPDIR: /tmp/ruby
              # Envoy terminates TLS and talks plaintext to the pod. ASSUME_SSL
              # makes Rails generate https:// URLs and mark cookies secure;
              # FORCE_SSL stays off because a redirect decided in the pod would
              # loop against a proxy that already served https.
              RAILS_ASSUME_SSL: "true"
              RAILS_FORCE_SSL: "false"
              DB_HOST: postgres-sure-rw
              DB_PORT: "5432"
              # Database 0; nothing else shares this Dragonfly.
              REDIS_URL: redis://sure-dragonfly:6379/0

              # -- AI ---------------------------------------------------------
              #
              # The Oracle Ampere A1 that already serves Karakeep -- 2 vCPU, no
              # GPU -- over Ollama's OpenAI-compatible API. Same model, so
              # nothing new is loaded: OLLAMA_MAX_LOADED_MODELS is 1 and a
              # second model would evict the first.
              #
              # Sure and Karakeep will queue behind each other, which is
              # correct on this hardware rather than a limitation to tune away:
              # two cores cannot run two inferences, and OLLAMA_NUM_PARALLEL is
              # deliberately 1 for that reason.
              #
              # This covers auto-categorisation and merchant detection, both of
              # which run in Sidekiq as batches. The chat sidebar and Insights
              # will technically work and be slow; that is the trade for the
              # feature costing nothing.
              LLM_PROVIDER: openai
              OPENAI_URI_BASE: https://ai.${SECRET_DOMAIN}/v1
              # Required whenever URI Base is set -- Sure has no default for a
              # custom endpoint.
              OPENAI_MODEL: qwen2.5:3b-instruct-q4_K_M
              # Prefill dominates on CPU, so the context window is the main
              # lever on how long a batch takes. 2048 is Sure's default and
              # matches what Karakeep settled on for this box.
              LLM_CONTEXT_WINDOW: "2048"
              LLM_MAX_RESPONSE_TOKENS: "512"
              # Down from the default of 25. The ceiling here is not Sure's
              # timeout but Cloudflare's: it severs a request at 100 seconds on
              # every plan below Enterprise, and no application-side setting can
              # rescue a connection the edge has already cut. Smaller batches
              # keep each call inside that.
              LLM_MAX_ITEMS_PER_CALL: "10"
              # Under the 100s edge limit on purpose, so Sure gives up and
              # retries rather than the request dying at the proxy.
              OPENAI_REQUEST_TIMEOUT: "90"
              OPENAI_ACCESS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: sure-ai
                    key: OPENAI_ACCESS_TOKEN
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: &pg postgres-sure-app
                    key: dbname
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: *pg
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *pg
                    key: password

              # -- SSO ------------------------------------------------------
              #
              # Local email/password login is off, so the login page offers
              # Pocket ID and nothing else. That matters more here than on most
              # apps: Sure's own docs tell you to register the first user and
              # *then* restrict signups in Settings, which on a published URL is
              # an open registration form for however long that takes.
              #
              # The admin override is the break-glass path: with local login
              # disabled a super_admin can still sign in with a password, so a
              # broken Pocket ID does not lock the owner out of their ledger.
              # Regular users stay SSO-only either way.
              AUTH_LOCAL_LOGIN_ENABLED: "false"
              AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED: "true"
              # Onboarding is closed, and it takes both of these.
              #
              # ONBOARDING_STATE closes the local registration controller:
              # ensure_signup_open redirects to the login page when it is
              # "closed". It is only a default for a rails-settings field, so
              # it applies until someone writes the setting from the admin UI,
              # after which the database wins and this is ignored.
              #
              # It does NOT cover SSO. onboarding_state is referenced only by
              # the registrations controller and the hosting settings screen --
              # nothing in the OIDC path reads it -- so with JIT left at
              # create_and_link a provider identity would still mint a user and
              # a family, which is the "logging in is signing up" shape this
              # repository has been bitten by before. link_only requires the
              # identity to match an existing user and blocks creation.
              #
              # link_only is only safe once an account exists: it was
              # create_and_link for the first sign-in, and there is now one
              # user, already super_admin.
              ONBOARDING_STATE: closed
              AUTH_JIT_MODE: link_only
              OIDC_ISSUER: https://id.${SECRET_DOMAIN}
              OIDC_REDIRECT_URI: https://sure.${SECRET_DOMAIN}/auth/openid_connect/callback
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: &oidc sure-oidc
                    key: client_id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: *oidc
                    key: client_secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: &port 3000
                  initialDelaySeconds: 0
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  # Rails boots slowly, and the migrate init container has
                  # already run by this point.
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 1Gi
          worker:
            image: *image
            command:
              - "bundle"
              - "exec"
              - "sidekiq"
            env: *env
            envFrom: *envFrom
            # Sidekiq serves no HTTP, so there is nothing to probe. Its health
            # is whether jobs drain, which Prometheus cannot see either -- a
            # dead worker here is silent, which is the failure mode upstream
            # warns about.
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      storage:
        existingClaim: sure-storage
        globalMounts:
          - path: /rails/storage
      # Two of them, and both are needed. /rails/tmp is where Rails keeps pids,
      # its cache and uploads in flight; /tmp is what Ruby's Dir.tmpdir
      # resolves to, checked at boot before any of the app loads. With
      # readOnlyRootFilesystem and only the first one mounted, rake never got
      # as far as the database:
      #   system temporary path is not writable: /tmp
      #   rake aborted!
      #   ArgumentError: could not find a temporary directory
      rails-tmp:
        type: emptyDir
        globalMounts:
          - path: /rails/tmp
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "sure.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
