---
# Rails secrets for Sure.
#
# SECRET_KEY_BASE signs sessions and cookies. Changing it logs everyone out; it
# does not lose data.
#
# The three ACTIVE_RECORD_ENCRYPTION_* keys are different -- they encrypt the
# provider credentials (bank sync, market data) stored in the database. Lose or
# change them and those rows become undecryptable, so they are generated once
# and then left alone. They are set up front rather than added later, because
# adding them after credentials exist is the case that breaks.
#
# Generate:
#
#   SECRET_KEY_BASE                              openssl rand -hex 64
#   ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY         openssl rand -hex 16
#   ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY   openssl rand -hex 16
#   ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT openssl rand -hex 16
#
# then `sops kubernetes/apps/sure/sure/app/secret.sops.yaml`.
#
# Mounted with envFrom, so every key here becomes an environment variable in
# both the Rails container and the Sidekiq worker. reloader.stakater.com/auto is
# on the Deployment, so the pod restarts itself once this changes.
apiVersion: v1
kind: Secret
metadata:
  name: sure-secret
type: Opaque
stringData:
  SECRET_KEY_BASE: ENC[AES256_GCM,data:DHYjbQwYo0iVn3HxzIuCjJ+GkqGPSBxfjU5snxg4wJA=,iv:9zN8uQbkBAy9V+WTes4EJDwDYE95jaZW03mWrkxXWhY=,tag:7dCiV695oGpkgxiJD9BgUQ==,type:str]
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ENC[AES256_GCM,data:rEnzKpqicmq7pogn+1S3T96HC/wMSusUUeZM7Wu9uuE=,iv:PjClmPjCQDPZdHz0n73niubJfEJWtJaen/Tzrn8H6Fo=,tag:KN+Afw5G2NP2v+QX9awIqQ==,type:str]
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ENC[AES256_GCM,data:rruPxJZa4lzFC0jRfik3i+VmSmuyPar6mDmzNY8pC1E=,iv:KKdMBZ/LxRLphq2C1vgwq52/gSS8UBnzmoU3WtGGJlI=,tag:NCtYnpvbbynsjijy+T6kSw==,type:str]
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ENC[AES256_GCM,data:OMvZ7vklSU6wXDPTv1tVvMkyYTUMLsrVYQwWJc72h9w=,iv:Dxsioc1h9Ue27f2FAVUpga02aBFjJZOHETfZxN2hQ5Y=,tag:pmZYWifpg3grevzIg9E4aA==,type:str]
