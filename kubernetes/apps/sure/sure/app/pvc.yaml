---
# /rails/storage -- Active Storage. Uploaded statements, imported CSVs and
# attachments land here, and both the Rails container and the Sidekiq worker
# read and write it, which is why they share one pod rather than scaling
# separately.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sure-storage
  annotations:
    resize.topolvm.io/storage_limit: 30Gi
    resize.topolvm.io/threshold: 20%
    resize.topolvm.io/increase: 20%
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
