---
# The bearer token the Caddy in front of Ollama checks.
#
# Ollama has no authentication of its own; the Caddy on the Oracle box is what
# gates https://ai.${SECRET_DOMAIN}. This is the same value as OPENAI_API_KEY in
# karakeep-secret -- Secrets do not cross namespaces, so it is repeated here
# rather than shared.
#
#   sops kubernetes/apps/sure/sure/app/secret-ai.sops.yaml
#
# Kept apart from secret.sops.yaml on purpose: that one holds Rails' own signing
# and encryption keys, which must never change; this one is an external service
# credential that can be rotated whenever the Caddy's is.
apiVersion: v1
kind: Secret
metadata:
  name: sure-ai
type: Opaque
stringData:
  OPENAI_ACCESS_TOKEN: ENC[AES256_GCM,data:Fiot11hskV9SJ/uEdP4T4Gbs6g/ONQb5rfjcuNlgBj1APRFuV9ndiV2Eol2uHO0CziLlCxjx,iv:ac6DRxyz+2TI1Ge0aPCh72/JzKVtF9vwdabiX3doW80=,tag:1IPxcaGAu1x8XYOiJHgCaw==,type:str]
