# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: sure-dragonfly
spec:
  replicas: 1
  args:
    # One thread, matching immich and ghostfolio. Dragonfly reserves 256MiB per
    # proactor and refuses to start when maxmemory (80% of the limit) cannot
    # cover them all. Sidekiq uses this as a job queue, not a data store.
    - --proactor_threads=1
    - --default_lua_flags=allow-undeclared-keys
    - --cluster_mode=emulated
  resources:
    requests:
      cpu: 50m
    limits:
      memory: 384Mi
