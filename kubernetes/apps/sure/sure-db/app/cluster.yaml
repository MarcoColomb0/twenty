# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-sure
spec:
  instances: 2
  # Sure is a Rails app: the whole ledger, holdings and imported transactions
  # live here, so this volume is the application, not a cache.
  inheritedMetadata:
    annotations:
      resize.topolvm.io/storage_limit: 20Gi
      resize.topolvm.io/threshold: 20%
      resize.topolvm.io/increase: 20%
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Continuous WAL archiving. The ScheduledBackup takes base backups; this is
  # what lets recovery land between them rather than only on one.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: "sure"
  bootstrap:
    initdb:
      database: sure
      owner: sure
