---
# konflate's GitHub App credential and webhook secret.
#
# The chart's own secret block has no field for the client id, and
# config.appClientId would be written into the rendered Deployment in a public
# repository -- so the whole credential belongs here instead and reaches the
# container through envFrom, which turns every key below into the matching
# environment variable.
#
# The two App keys are deliberately ABSENT rather than placeheld. konflate
# parses KONFLATE_APP_PRIVATE_KEY at startup and exits on anything that is not
# real PEM:
#
#   konflate exited  error="provider: github: parse App private key
#   (KONFLATE_APP_PRIVATE_KEY): invalid key: Key must be a PEM encoded PKCS1 or
#   PKCS8 key"
#
# With them missing it starts read-only instead -- this repository is public, so
# it renders every PR and serves the UI unauthenticated, just at a lower API
# rate limit. Only write-back waits.
#
# KONFLATE_WEBHOOK_SECRET is any random string; it only has to match what the
# GitHub App sends. Until that App exists nothing signs with it, so /hooks
# rejects everything that arrives.
#
# To turn write-back on:
#
#  1. Create a GitHub App (Settings -> Developer settings -> GitHub Apps).
#     Repository permissions: Pull requests: Read and write, Commit statuses:
#     Read and write, Contents: Read-only. Nothing else -- konflate never
#     pushes. Subscribe to the Pull request and Push events.
#  2. Install it on MarcoColomb0/twenty only.
#  3. Generate a private key; GitHub downloads a .pem.
#  4. Point the App's webhook at https://konflate-webhook.${SECRET_DOMAIN}/hooks
#     and set its secret to the KONFLATE_WEBHOOK_SECRET value below.
#  5. `sops kubernetes/apps/konflate/konflate/app/secret.sops.yaml` and add two
#     keys beside it -- KONFLATE_APP_CLIENT_ID, and KONFLATE_APP_PRIVATE_KEY as
#     a block scalar holding the PEM.
#
# reloader.stakater.com/auto is set on the Deployment, so the pod restarts
# itself once this Secret changes.
apiVersion: v1
kind: Secret
metadata:
  name: konflate-secret
type: Opaque
stringData:
  KONFLATE_WEBHOOK_SECRET: ENC[AES256_GCM,data:xQkN0+ACNjX2mlvo7jeCqO/212tNBnIjZJ+ch2oL+ZTfAg7f,iv:Y4uHnODOyuwqEPADoHfb5wntQgA5l6iNE601bi6oewo=,tag:QoNlyjo2nYPxL2UlZRDyQg==,type:str]
sops:
  age:
    - enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSB4bW9uMTRweGl4MnFIU2hU
        TWJTNm9XazE1OUc3UW93TVFscDJzcW8xeDFRCjJNcmFTdVRvTWhmTlRaZkt0T3JH
        QjJ4cnJiYnJpRUcrKzgrRFRiM0t3M2sKLS0tIGJ6ZlZuck55TWdVOUpxZVFDeEFV
        ODRhVWxJT0I4RHk1bmNwcmJ1TEJ1ZUEKRDUHOyfyV+VjxFNC1c0kGCgIyoTDU31h
        YN2ZxTpe8zRwKOFBL/v/cJfAn6DjctjIAH8a+37MKpdImDwAsVUgyw==
