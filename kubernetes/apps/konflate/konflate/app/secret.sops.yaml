---
# konflate's GitHub App credential and webhook secret.
#
# The chart's own secret block has no field for the client id, and
# config.appClientId would be written into the rendered Deployment in a public
# repository -- so the whole credential is kept here instead and reaches the
# container through envFrom, which turns every key below into the matching
# environment variable.
#
# To fill this in:
#
#  1. Create a GitHub App (Settings -> Developer settings -> GitHub Apps).
#     Repository permissions: Pull requests: Read and write, Commit statuses:
#     Read and write, Contents: Read-only. Nothing else -- konflate never
#     pushes. Subscribe to the Pull request and Push events.
#  2. Install it on MarcoColomb0/twenty only.
#  3. Generate a private key; GitHub downloads a .pem.
#  4. Point the App's webhook at https://konflate-webhook.${SECRET_DOMAIN}/hooks
#     with a secret of your choosing, and put that same value in
#     KONFLATE_WEBHOOK_SECRET below.
#  5. sops kubernetes/apps/konflate/konflate/app/secret.sops.yaml
#
# The private key is multi-line PEM; keep the block scalar.
#
# Until this holds a real key konflate still renders and serves the UI -- the
# repository is public, so reads work unauthenticated at a lower rate limit --
# it just posts nothing back and answers 501 on /hooks.
apiVersion: v1
kind: Secret
metadata:
  name: konflate-secret
type: Opaque
stringData:
  KONFLATE_APP_CLIENT_ID: ENC[AES256_GCM,data:82Mx9lVtkGQPl16U49rfJCK/Egc=,iv:ZsKDhVcJNCWoxkTmj05liDVdSGUXn5nK43wU1Shgp4g=,tag:V5B3cBzhHCm1+fDFWePqgQ==,type:str]
