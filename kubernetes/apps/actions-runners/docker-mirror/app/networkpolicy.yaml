---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docker-mirror
spec:
  # Plain HTTP and unauthenticated, so only the runners may use it. Egress is
  # left open: it has to reach Docker Hub.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docker-mirror
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              actions.github.com/scale-set-name: argus-runners
              app.kubernetes.io/component: runner
      ports:
        - protocol: TCP
          port: 5000
