---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docker-mirror
spec:
  chartRef:
    kind: OCIRepository
    name: docker-mirror
  interval: 1h
  values:
    # A pull-through cache of Docker Hub for the CI runners' dind daemons
    # (argus-runners), so postgres:17 and the other job and service images
    # cross the slow WAN once instead of on every run. dockerd's
    # registry-mirrors only ever apply to docker.io, hence Docker Hub alone.
    controllers:
      docker-mirror:
        # One pod holds the RWO volume; Recreate avoids two fighting over it.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/library/registry
              tag: 3.1.2
            env:
              REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
              # How long a cached blob is kept after its last pull. Pinned
              # images refresh on their own when Renovate bumps them.
              REGISTRY_PROXY_TTL: 720h
              REGISTRY_STORAGE_DELETE_ENABLED: "true"
              OTEL_TRACES_EXPORTER: none
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5000
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: docker-mirror
        ports:
          http:
            port: 5000
    persistence:
      data:
        existingClaim: docker-mirror
        globalMounts:
          - path: /var/lib/registry
