---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
spec:
  chartRef:
    kind: OCIRepository
    name: arc-controller
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: arc-controller
    # Runner scale sets live only in this namespace; the controller has no
    # business watching the rest of the cluster.
    flags:
      watchSingleNamespace: actions-runners
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 256Mi
