---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apt-cache
  annotations:
    resize.topolvm.io/storage_limit: 20Gi
    resize.topolvm.io/threshold: 20%
    resize.topolvm.io/increase: 20%
spec:
  # Re-downloadable, so no VolSync.
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
