---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  chartRef:
    kind: OCIRepository
    name: stirling-pdf
  interval: 1h
  values:
    controllers:
      stirling-pdf:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/stirling-tools/stirling-pdf
              tag: "2.14.2"
            env:
              DISABLE_ADDITIONAL_FEATURES: "false"
              SYSTEM_DEFAULTLOCALE: en-GB
              # Pocket ID cannot be used here. Stirling gates OAuth user
              # auto-creation behind a paid licence and refuses the login:
              #   User NOT eligible for OAuth: no paid license and not
              #   grandfathered
              # Only users that predate the policy change are exempt, and a
              # fresh install has none. So this is a local account, with its
              # password generated and held in SOPS.
              SECURITY_ENABLELOGIN: "true"
              SECURITY_LOGINMETHOD: normal
              SECURITY_OAUTH2_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: stirling-pdf-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/info/status
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
                # Its init script chowns /tmp/stirling-pdf and symlinks helpers
                # into /usr/local/bin before the app starts. Without CHOWN it
                # exits with "chown: changing ownership of '/tmp/stirling-pdf':
                # Operation not permitted".
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "FOWNER"
                  - "SETUID"
                  - "SETGID"
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        # The image's entrypoint writes into /usr/local/bin and chowns its own
        # temp directory, so it has to start as root. fsGroup still hands it the
        # config volume without a chown of its own.
        runAsNonRoot: false
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      # Settings and any custom pipelines survive a restart.
      config:
        existingClaim: stirling-pdf-config
        globalMounts:
          - path: /configs
      # Uploads are processed and thrown away. Keeping them on a PVC would mean
      # storing other people's documents for no reason.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      logs:
        type: emptyDir
        globalMounts:
          - path: /logs
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # 401 is the healthy answer now that login is required: an
          # unauthenticated probe getting anything else would mean the app is
          # serving without asking who is knocking.
          gatus.home-operations.com/endpoint: |
            conditions:
              - "[STATUS] == 401"
        hostnames:
          - "pdf.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
