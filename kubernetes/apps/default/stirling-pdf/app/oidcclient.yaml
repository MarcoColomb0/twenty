---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: stirling-pdf
spec:
  callbackUrls:
    # Spring Security derives this from the registration id, and Stirling's
    # generic OIDC slot is named "keycloak" whatever provider is behind it.
    - https://pdf.${SECRET_DOMAIN}/login/oauth2/code/keycloak
  logoutCallbackUrls:
    - https://pdf.${SECRET_DOMAIN}
  pkceEnabled: true
  skipConsent: true
  secret:
    name: stirling-pdf-oidc
    keys:
      clientID: client_id
      clientSecret: client_secret
