---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: it-tools
spec:
  chartRef:
    kind: OCIRepository
    name: it-tools
  interval: 1h
  values:
    controllers:
      it-tools:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/corentinth/it-tools
              tag: 2024.10.22-7ca5933
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
                  initialDelaySeconds: 5
                  periodSeconds: 20
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
                # nginx's entrypoint chowns its cache directories and then drops
                # from root to its own user, so it needs these three back.
                # Without CHOWN it exits at startup with
                # chown("/var/cache/nginx/client_temp", 101) failed
                # (1: Operation not permitted). This is the whole reason the
                # container cannot simply run unprivileged.
                add:
                  - "CHOWN"
                  - "SETUID"
                  - "SETGID"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        # nginx starts as root and drops to its own user, so this cannot be
        # true. Everything served is baked into the image and its filesystem is
        # writable, so no volume is needed either.
        runAsNonRoot: false
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "it-tools.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
