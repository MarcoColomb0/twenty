---
# LiteLLM's two keys. Neither is a provider credential -- there is no Anthropic
# key anywhere in this app, by design.
#
#   LITELLM_MASTER_KEY  signs and validates the virtual keys handed to clients,
#                       and is itself the admin credential for the UI at /ui.
#                       Must start with "sk-". Rotating it invalidates every key
#                       already issued.
#
#   LITELLM_SALT_KEY    encrypts credentials at rest in the database. This one
#                       can never change once rows exist: a different salt makes
#                       every stored value undecryptable, with no way back.
#
# Generate both:
#
#   printf 'sk-%s\n' "$(openssl rand -hex 32)"   # LITELLM_MASTER_KEY
#   openssl rand -hex 32                          # LITELLM_SALT_KEY
#
# then `sops kubernetes/apps/litellm/litellm/app/secret.sops.yaml`.
#
# reloader.stakater.com/auto is on the Deployment, so the pod restarts itself
# once this changes.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secret
type: Opaque
stringData:
  LITELLM_MASTER_KEY: ENC[AES256_GCM,data:QTi9OEVroCCtS0AyrxOmr+SivEZXehxJMr3KfBQ/hw==,iv:fS1bfSvCI1M7PP+hUmP932w69gOm/HnIXL7XMQzDVWQ=,tag:aORa/K6xRCLCuiQ0XOFPag==,type:str]
  LITELLM_SALT_KEY: ENC[AES256_GCM,data:N4Wc3HfV/HanTd6renDablcGEdRnM7avjww+wBlHApw=,iv:u+zo6Jo83kEuIcZv2Ld7A4VZHQvIghJJe32ma0FwcRk=,tag:y/jgIYgzj53gJlB3/9AvBg==,type:str]
sops:
  age:
    - enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBMNTRxNW5uV2t6a1JQOUNI
        QmovQzhQMkRCWjFDK0RDSHJRaFgzcnFRbUQwCjJjK3hVbzdKZzNJc1dCRFpLR2xy
        dFJYdUdudnc4TlF1WHdqdlcrVzRyOEUKLS0tIENIUWtHQWpmRXRsUW4wTk1LbXp1
        ZWw3cXRoZXAvTVRIaUFVQWZBa3dNem8Kftt2wQDYE1Stff1XXc091VIFyKbCDQkP
        nDxxxgQ28Sq9t+COT8SdfyKVmtznVOxXtRFO+HM/9xE224l3WhW+kA==
        -----END AGE ENCRYPTED FILE-----
      recipient: age1txcyeza70lxefaz3m45jxyf074czteej3z843js7z9fh8ndv5pxqll2tex
