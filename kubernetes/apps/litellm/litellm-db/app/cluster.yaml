# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-litellm
spec:
  instances: 2
  # Virtual keys, teams, budgets and the request/spend log. Small, but it is
  # the only copy of the keys people are authenticating with.
  inheritedMetadata:
    annotations:
      resize.topolvm.io/storage_limit: 20Gi
      resize.topolvm.io/threshold: 20%
      resize.topolvm.io/increase: 20%
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: "litellm"
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
