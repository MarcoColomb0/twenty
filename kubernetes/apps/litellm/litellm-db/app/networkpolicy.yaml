---
# A podSelector with no namespaceSelector matches only pods in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-dragonfly-allow-app
spec:
  podSelector:
    matchLabels:
      app: litellm-dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 6379
          protocol: TCP
  policyTypes:
    - Ingress
