---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: dragonfly-operator
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/litellm/litellm-db/app
  postBuild:
    substitute:
      APP: litellm
      CNPG_BACKUP_SCHEDULE: "0 0 5 * * *"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: litellm
  wait: true
