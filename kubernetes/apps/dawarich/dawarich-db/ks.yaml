---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dawarich-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: dragonfly-operator
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/dawarich/dawarich-db/app
  postBuild:
    substitute:
      APP: dawarich
      CNPG_BACKUP_SCHEDULE: "0 30 4 * * *"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: dawarich
  wait: true
