---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: dawarich
spec:
  callbackUrls:
    - https://dawarich.${SECRET_DOMAIN}/users/auth/openid_connect/callback
  logoutCallbackUrls:
    - https://dawarich.${SECRET_DOMAIN}
  pkceEnabled: true
  skipConsent: true
  # The actual access list, and load-bearing rather than defence in depth.
  # OIDC_AUTO_REGISTER has to be true for a first sign-in to create an account
  # at all -- from_omniauth returns nil for an unknown identity otherwise, and
  # the collision path for a matching email wants a verification mail this
  # cluster cannot send. So while that is true, anything Pocket ID lets through
  # gets an account. Group membership is what stops the authorization code
  # being issued in the first place.
  allowedUserGroups:
    - name: dawarich-users
  secret:
    name: dawarich-oidc
    keys:
      clientID: client_id
      clientSecret: client_secret
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: dawarich-users
spec:
  friendlyName: Dawarich Users
