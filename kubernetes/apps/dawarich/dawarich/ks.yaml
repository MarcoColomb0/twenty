---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dawarich
spec:
  dependsOn:
    # Reads postgres-dawarich-app, which CNPG publishes beside the Cluster in
    # this namespace, and needs Dragonfly up for Sidekiq to enqueue.
    - name: dawarich-db
      namespace: dawarich
  interval: 1h
  path: ./kubernetes/apps/dawarich/dawarich/app
  postBuild:
    substitute:
      APP: dawarich
      VOLSYNC_CLAIM: dawarich-storage
      VOLSYNC_SCHEDULE: "0 6 * * *"
      VOLSYNC_CACHE_CAPACITY: 2Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: dawarich
  wait: false
