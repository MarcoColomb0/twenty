---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: immich-proxy
  interval: 1h
  values:
    controllers:
      immich-proxy:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/alangrainger/immich-public-proxy
              tag: "3.2.0"
            env:
              # Reaches Immich over the cluster network, so Immich itself needs
              # no external route. This proxy serves /share links and nothing
              # else -- the library and the admin UI are not reachable through
              # it even though it is the only publicly exposed half.
              # immich-app, not immich. The server's Service is generated by
              # app-template as <release>-<serviceKey>, and it was plain
              # "immich" only while that chart rendered a single service. Adding
              # the machine-learning controller alongside it renamed this one,
              # which crashlooped the proxy for hours with
              #   Unable to reach Immich on http://immich.immich.svc...:2283
              IMMICH_URL: http://immich-app.immich.svc.cluster.local:2283
              PUBLIC_BASE_URL: https://photos.${SECRET_DOMAIN}
              # No landing page: an unauthenticated visitor to the bare
              # hostname should learn nothing about what is behind it.
              CONFIG: '{"ipp": {"showHomePage": false}}'
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /share/healthcheck
                    port: &port 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # / is deliberately 404 here -- showHomePage is off so a visitor to
          # the bare hostname learns nothing. Probe the health path instead, or
          # the status page reports the proxy down while it is working.
          gatus.home-operations.com/endpoint: |
            path: /share/healthcheck
        hostnames:
          - "photos.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
