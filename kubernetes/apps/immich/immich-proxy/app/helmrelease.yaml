---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: immich-proxy
  interval: 1h
  values:
    controllers:
      immich-proxy:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/alangrainger/immich-public-proxy
              tag: "4.1.1"
            env:
              # Reaches Immich over the cluster network, so Immich itself needs
              # no external route. This proxy serves /share links and nothing
              # else -- the library and the admin UI are not reachable through
              # it even though it is the only publicly exposed half.
              # immich-app, not immich. The server's Service is generated by
              # app-template as <release>-<serviceKey>, and it was plain
              # "immich" only while that chart rendered a single service. Adding
              # the machine-learning controller alongside it renamed this one,
              # which crashlooped the proxy for hours with
              #   Unable to reach Immich on http://immich.immich.svc...:2283
              IMMICH_URL: http://immich-app.immich.svc.cluster.local:2283
              PUBLIC_BASE_URL: https://photos.${SECRET_DOMAIN}
              # The privacy-relevant values are stated even where they match the
              # 4.0 default, so a future default change cannot quietly widen what
              # visitors see. The exif fields are left out only because every
              # one of them already defaults to hidden.
              #
              # showHomePage: no landing page; an unauthenticated visitor to the
              # bare hostname should learn nothing about what is behind it.
              # allowDownload 1: the per-share "Allow download" toggle in Immich
              # decides, rather than IPP forcing it on (2) for every share.
              # downloadedFilename 2: anonymous share-hash names, so original
              # filenames (dates, device names) never leave the house.
              # showMetadata: 4.0 hides every field unless its flag is true,
              # except location.webLink, which defaults to true and hands the
              # visitor a map link to where the photo was taken.
              # allowSlugLinks stays on: one live share uses a custom /s/ URL.
              # uploadUrl keeps its default, /upload, which the route below sends
              # to the upload controller. This container stays read-only either
              # way; writes happen only in that one.
              CONFIG: >-
                {"ipp": {
                  "showHomePage": false,
                  "allowDownload": 1,
                  "downloadedFilename": 2,
                  "showMetadata": {
                    "description": {"caption": false, "sidebar": false},
                    "location": {"city": false, "state": false, "country": false, "gps": false, "webLink": false}
                  }
                }}
            probes:
              # 4.0's healthcheck fails whenever Immich is unreachable. That is
              # right for readiness -- stop routing to a proxy that cannot serve
              # -- but as liveness it would restart a healthy proxy every time
              # the server restarts, which fixes nothing. Liveness only asks
              # whether the process is listening.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /share/healthcheck
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
      # Visitor uploads, as a separate container so the gallery above never
      # gains a write path. It holds no API key: each file is streamed to
      # Immich with the share's own key, exactly as Immich's public share page
      # does, so it can only add to a share whose "Allow public user to
      # upload" toggle is on in Immich. Every other share answers 404.
      #
      # One replica on purpose. Password-protected shares unlock with a
      # session cookie signed by a secret generated at process start, so a
      # second replica would reject the cookie the first one issued.
      upload:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/alangrainger/immich-public-proxy-upload
              tag: "4.1.1"
            env:
              IMMICH_URL: http://immich-app.immich.svc.cluster.local:2283
              PUBLIC_BASE_URL: https://photos.${SECRET_DOMAIN}
              # maxFileSize 95: Cloudflare refuses any request over 100 MB on
              # the free plan, tunnel included, and each file is one request.
              # Under the cap the page refuses a bigger file up front, rather
              # than the visitor watching it upload and then fail at the edge.
              # Long videos therefore cannot be sent this way.
              #
              # byteBudget is per share per hour, across all visitors, and is
              # the real ceiling on how much disk a leaked link can fill. 2 GB
              # an hour is a few hundred phone photos; the 10 GB default is
              # more than any guest needs.
              #
              # rateLimit is keyed on the client address, and that address is
              # always an envoy pod, so in practice it is per share, not per
              # visitor.
              #
              # filenamePrefix is what the Immich review workflow matches on.
              CONFIG: >-
                {"ipp": {
                  "allowSlugLinks": true,
                  "customInvalidResponse": false,
                  "upload": {
                    "maxFileSize": 95,
                    "rateLimit": 60,
                    "byteBudget": 2048,
                    "filenamePrefix": "ipp_upload_",
                    "notifyUrl": "",
                    "notifyHeaders": {},
                    "notifyTimeout": 10000
                  }
                }}
            probes:
              # Same split as the gallery: the healthcheck fails while Immich
              # is unreachable, which should stop traffic but not restart this.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              # Files are streamed through, never written here.
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    # A second service renames the first from immich-proxy to
    # immich-proxy-app. Nothing refers to it by name -- the route uses
    # identifiers -- so that is harmless here.
    service:
      app:
        controller: immich-proxy
        ports:
          http:
            port: *port
      upload:
        controller: upload
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # / is deliberately 404 here -- showHomePage is off so a visitor to
          # the bare hostname learns nothing. Probe the health path instead, or
          # the status page reports the proxy down while it is working.
          gatus.home-operations.com/endpoint: |
            path: /share/healthcheck
        hostnames:
          - "photos.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          # The upload service serves its routes under /upload as well as at
          # the root, so the prefix is forwarded unchanged.
          - matches:
              - path:
                  type: PathPrefix
                  value: /upload
            backendRefs:
              - identifier: upload
                port: *port
          - backendRefs:
              - identifier: app
                port: *port
