---
# This proxy is the only part of Immich published to the internet, so it is
# the pod an attacker would land in. It needs exactly two things: requests from
# the external gateway, and the Immich API. Everything else -- the database,
# the ML service, the LAN, the internet -- is denied, so a compromised proxy
# cannot be used to reach past the share API it already fronts.
#
# Kubelet probes come from the host, which Cilium admits regardless of policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: immich
              app.kubernetes.io/controller: immich
      ports:
        - port: 2283
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
