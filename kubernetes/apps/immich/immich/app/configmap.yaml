---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-config
data:
  # A template, not the file Immich reads. clientId and clientSecret are minted
  # by the pocket-id-operator into the immich-oidc Secret and are injected at
  # startup by the init-config container -- this repository is public, so no
  # credential may appear here.
  #
  # Note that IMMICH_CONFIG_FILE makes the whole admin settings page read-only:
  # Immich refuses with "Cannot update configuration while IMMICH_CONFIG_FILE
  # is in use". Every setting worth changing has to be changed here.
  #
  # This is JSON, so it takes no comments of its own -- anything worth saying
  # about a value has to be said up here.
  #
  # ffmpeg.accel stays disabled even though twenty-hp01 has a usable iGPU.
  # hostPath makes /dev/dri/renderD128 visible at mode 0666, but the cgroup
  # device controller still denies char device 226:128: opening it returns
  # EPERM, and vainfo reports "Failed to open the given device". Reaching it
  # needs a privileged container or the Intel GPU device plugin, so this stays
  # on software encoding rather than a value that only fails once someone
  # uploads a video.
  immich.json: |-
    {
      "machineLearning": {
        "enabled": false
      },
      "newVersionCheck": {
        "enabled": false
      },
      "ffmpeg": {
        "accel": "disabled",
        "accelDecode": true,
        "targetVideoCodec": "h264",
        "targetResolution": "1080",
        "preset": "medium"
      },
      "oauth": {
        "enabled": true,
        "issuerUrl": "https://id.${SECRET_DOMAIN}/.well-known/openid-configuration",
        "endSessionEndpoint": "https://id.${SECRET_DOMAIN}/api/oidc/end-session",
        "clientId": "",
        "clientSecret": "",
        "scope": "openid email profile",
        "signingAlgorithm": "RS256",
        "profileSigningAlgorithm": "none",
        "tokenEndpointAuthMethod": "client_secret_post",
        "buttonText": "Login with Pocket ID",
        "autoRegister": true,
        "autoLaunch": false,
        "mobileOverrideEnabled": false,
        "storageLabelClaim": "preferred_username",
        "timeout": 30000
      }
    }
