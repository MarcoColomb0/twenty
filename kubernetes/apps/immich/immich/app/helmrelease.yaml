---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v2.6.3
            env:
              DB_HOSTNAME: immich-db-rw
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_SSL_MODE: disable
              REDIS_HOSTNAME: immich-cache
              REDIS_PORT: "6379"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: password

    immich:
      persistence:
        library:
          existingClaim: immich-library

    valkey:
      enabled: false

    server:
      enabled: true

    machine-learning:
      enabled: true
      persistence:
        cache:
          enabled: true
          size: 10Gi
          type: persistentVolumeClaim
          storageClass: local-path

    service:
      main:
        ports:
          http:
            port: 3001
