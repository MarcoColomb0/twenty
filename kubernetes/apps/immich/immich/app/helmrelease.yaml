---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      immich:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0
            env:
              IMMICH_PORT: &port 2283
              IMMICH_MEDIA_LOCATION: /data
              DB_HOSTNAME: postgres-immich-rw.immich.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: &dbsecret postgres-immich-app
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *dbsecret
                    key: password
              REDIS_HOSTNAME: immich-dragonfly.immich.svc.cluster.local
              REDIS_PORT: "6379"
              # Matches the service the machine-learning controller publishes
              # below. Stated rather than left to the chart's default so the
              # coupling is visible from the server's side too.
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  # The first boot runs schema migrations against an empty
                  # database, which takes considerably longer than a restart.
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
                # Allocated by the Intel GPU device plugin, which is what
                # actually grants the device cgroup entry that hostPath could
                # not. It also places the pod: only nodes advertising this
                # resource are candidates, so no hostname pin is needed.
                gpu.intel.com/i915: 1
              limits:
                memory: 3Gi
                gpu.intel.com/i915: 1
      machine-learning:
        annotations:
          reloader.stakater.com/auto: "true"
        # Pinned to twenty-lp01 for its GPU, not for the node itself. Both Intel
        # boxes can run OpenVINO, but the N150 is Xe-LP (Gen12) -- the "Iris Xe
        # and Arc" family Immich names as the OpenVINO target -- while
        # twenty-hp01's UHD 630 is Gen9.5 from 2017, which the docs specifically
        # warn about ("more likely to experience issues, especially for older
        # processors"). twenty-asus01 is not a candidate at all: its Vega 6
        # (gfx90c, Renoir) is not an officially supported ROCm target, the ROCm
        # image wants 35GiB of disk, and nothing advertises a GPU there.
        #
        # This also keeps the two GPU consumers apart. intel-device-plugins runs
        # with sharedDevNum: 1, so one container per node holds the render node;
        # pinning ML here leaves twenty-hp01's iGPU free for the server's
        # transcoding, which is the only other thing that wants it.
        pod:
          nodeSelector:
            kubernetes.io/hostname: twenty-lp01
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.1.0-openvino
            env:
              MACHINE_LEARNING_CACHE_FOLDER: /cache
            probes:
              liveness: &mlprobes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &mlport 3003
                  initialDelaySeconds: 0
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *mlprobes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlport
                  # Cold start compiles the model for the iGPU, which is slow the
                  # first time and after any model change.
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 200m
                memory: 2Gi
                # The device plugin is what grants the device cgroup entry; a
                # hostPath mount shows the render node without the permission.
                gpu.intel.com/i915: 1
              limits:
                # OpenVINO uses noticeably more memory than CPU inference, and
                # nllb-clip-large-siglip is one of the bigger models.
                memory: 8Gi
                gpu.intel.com/i915: 1
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      # 100GB of phone photos today. Longhorn keeps two replicas, so this
      # reserves 150Gi twice over; the two smaller nodes have ~217GiB free
      # each, which fits. The class allows expansion, so growing it later does
      # not mean recreating the volume.
      data:
        existingClaim: immich-data
        # Scoped to the server, not global. This claim is ReadWriteOnce and is
        # attached to whichever node the server runs on; a globalMount would put
        # it in the machine-learning pod too, which is pinned to a different
        # node, and that pod could never start. ML never touches the library
        # anyway -- the server posts images to it over HTTP.
        advancedMounts:
          immich:
            app:
              - path: /data
      # Downloaded model weights. Two replicas rather than longhorn-single even
      # though this is a rebuildable cache: a single-replica volume is exactly
      # what blocked three node drains during the v1.13.8 rollout, because
      # Longhorn cannot rebuild a detached one-replica volume elsewhere and
      # refuses to let the node go. 5Gi replicated twice is cheaper than a
      # wedged upgrade.
      model-cache:
        existingClaim: immich-model-cache
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
    service:
      app:
        controller: immich
        ports:
          http:
            port: *port
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: *mlport
    route:
      app:
        # LAN only. Immich itself is never published; the only thing reachable
        # from outside is immich-proxy, which serves shared links alone.
        hostnames:
          - "immich.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
