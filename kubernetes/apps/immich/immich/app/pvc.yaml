---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data
  annotations:
    resize.topolvm.io/storage_limit: 250Gi
    resize.topolvm.io/threshold: 20%
    resize.topolvm.io/increase: 20%
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 150Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
  annotations:
    # Model switching holds the old and new weights at once, so this grows in steps rather than smoothly.
    resize.topolvm.io/storage_limit: 30Gi
    resize.topolvm.io/threshold: 20%
    resize.topolvm.io/increase: 20%
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Sized for the models actually in use, not the weights alone.
      # nllb-clip-large-siglip__v1 is 5.7G by itself; facial recognition adds
      # ~300M and OCR ~271M. At 7Gi that left no room for OpenVINO's compiled
      # GPU blobs, and every model load failed with
      #   [GPU] Failed to write 51380224 bytes to stream! Wrote 38189545
      # which reads like a GPU fault and is really ENOSPC.
      #
      # Headroom matters beyond steady state: switching a model downloads the
      # new one before the old is removed, so the volume has to hold both.
      storage: 20Gi
