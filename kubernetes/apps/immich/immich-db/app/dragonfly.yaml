# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: immich-dragonfly
spec:
  replicas: 1
  args:
    # Dragonfly demands 256MiB per proactor thread and refuses to start
    # otherwise: two threads under a 512Mi limit leaves it 409.6MiB of
    # maxmemory and it exits with "There are 2 threads, so 512.00MiB are
    # required". One thread is ample here -- Immich uses Redis as a job queue,
    # not as a data store.
    - --proactor_threads=1
    - --default_lua_flags=allow-undeclared-keys
    - --cluster_mode=emulated
  resources:
    requests:
      cpu: 50m
      # Explicit, because an absent memory request is filled from the limit and
      # scheduled as a reservation. The limit cannot come down any further --
      # one proactor needs 256MiB of maxmemory, which is 80% of it -- so this
      # is the only way to stop reserving 384Mi for a cache that uses 21Mi.
      memory: 64Mi
    limits:
      memory: 384Mi
