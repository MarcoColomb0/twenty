---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jellyfin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/controller: jellyfin
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 8096
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: "${WIREGUARD_ENDPOINT_IP}/32"
      ports:
        - port: ${WIREGUARD_ENDPOINT_PORT}
          protocol: UDP
