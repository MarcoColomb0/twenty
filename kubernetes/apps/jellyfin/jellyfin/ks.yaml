---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
spec:
  interval: 1h
  path: ./kubernetes/apps/jellyfin/jellyfin/app
  postBuild:
    substitute:
      APP: jellyfin
      VOLSYNC_CLAIM: jellyfin-config
      VOLSYNC_SCHEDULE: "45 5 * * *"
      VOLSYNC_CACHE_CAPACITY: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: jellyfin-vpn
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: jellyfin
  wait: false
