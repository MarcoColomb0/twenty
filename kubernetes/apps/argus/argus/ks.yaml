---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argus
spec:
  dependsOn:
    # DATABASE_URL comes from the CNPG-generated postgres-argus-app Secret
    - name: argus-db
      namespace: argus
  interval: 1h
  path: ./kubernetes/apps/argus/argus/app
  postBuild:
    substitute:
      APP: argus
      VOLSYNC_CLAIM: argus-browser
      VOLSYNC_SCHEDULE: "15 5 * * *"
      VOLSYNC_CACHE_CAPACITY: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: argus
  wait: false
