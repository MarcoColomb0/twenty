---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: argus
spec:
  callbackUrls:
    - https://argus.${SECRET_DOMAIN}/api/auth/callback/pocket-id
  # Sign-out goes through Pocket ID's end-session endpoint and comes back here.
  logoutCallbackUrls:
    - https://argus.${SECRET_DOMAIN}/login
  pkceEnabled: true
  skipConsent: true
  # Invite-only: Pocket ID refuses to issue a code to anyone outside these groups, and Argus
  # checks the same groups again on every sign-in (and reads admin from argus-admins).
  allowedUserGroups:
    - name: argus-users
    - name: argus-admins
  secret:
    name: argus-oidc
    keys:
      clientID: client_id
      clientSecret: client_secret
      issuerUrl: issuer_url
      # Explicit endpoints let sign-in survive a Pocket ID outage at pod start, when discovery
      # would otherwise fail and disable the provider until restart.
      authorizationUrl: authorization_url
      tokenUrl: token_url
      userinfoUrl: userinfo_url
      endSessionUrl: end_session_url
---
# Inviting someone = adding their Pocket ID username here.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: argus-users
spec:
  friendlyName: Argus Users
  # users:
  #   usernames:
  #     - friend
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: argus-admins
spec:
  friendlyName: Argus Admins
