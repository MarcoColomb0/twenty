---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 3.7.2
  # Codeberg, not ghcr.io -- upstream moved the project there and the
  # ghcr mirror stopped receiving releases at 3.7.2. It still resolves, so
  # nothing breaks; it simply never advertises another version again.
  url: oci://codeberg.org/k8s-gateway/charts/k8s-gateway
