---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "192.168.100.103"
      externalTrafficPolicy: Cluster
    watchedResources:
      - "HTTPRoute"
      - "Service"
    # CoreDNS now sends the whole cluster domain here, so this has to answer for
    # names that are not backed by a route as well -- public records like the
    # tunnel target, or the ACME challenge TXT. Without fallthrough those would
    # come back NXDOMAIN instead of their real answer.
    fallthrough:
      enabled: true
    # Setting this replaces the chart's whole default list rather than adding to
    # it, so every plugin has to be repeated. Dropping "ready" alone takes the
    # /ready endpoint with it, the readiness probe never passes, and the
    # LoadBalancer quietly loses its only endpoint -- which takes LAN DNS down.
    extraZonePlugins:
      - name: log
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: prometheus
        parameters: 0.0.0.0:9153
      # The one real change: the default here is /etc/resolv.conf, which points
      # at CoreDNS, which now forwards this domain back to this pod. Unknown
      # names would loop, so fallthrough goes straight to a public resolver.
      - name: forward
        parameters: . 1.1.1.1 1.0.0.1
      - name: loop
      - name: reload
      - name: loadbalance
