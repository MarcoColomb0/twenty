---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
spec:
  chartRef:
    kind: OCIRepository
    name: blocky
  interval: 1h
  values:
    controllers:
      blocky:
        replicas: 3
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.33.0
            args:
              - "--config"
              - "/app/config.yml"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    # blocky has no HTTP health endpoint, it self-queries over DNS
                    command:
                      - "/app/blocky"
                      - "healthcheck"
                      - "--port"
                      - "5353"
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # the upstream image runs as uid/gid 100
        runAsUser: 100
        runAsGroup: 100
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blocky

    service:
      app:
        controller: blocky
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.100.104"
        externalTrafficPolicy: Cluster
        ports:
          dns-tcp:
            port: 53
            # blocky runs unprivileged, so it cannot bind 53 inside the container
            targetPort: 5353
            protocol: TCP
          dns-udp:
            port: 53
            targetPort: 5353
            protocol: UDP
      metrics:
        controller: blocky
        ports:
          http:
            port: 4000

    serviceMonitor:
      app:
        serviceName: blocky-metrics
        endpoints:
          - port: http

    configMaps:
      config:
        # roll the pods automatically whenever this config changes
        includeChecksumInControllers:
          - blocky
        data:
          config.yml: |
            upstreams:
              init:
                # answer queries immediately instead of blocking on upstream checks
                strategy: fast
              groups:
                default:
                  - tcp-tls:one.one.one.one:853
                  - tcp-tls:dns.quad9.net:853
              strategy: parallel_best
              timeout: 2s

            # resolves the DoT hostnames above, avoiding a chicken-and-egg at startup
            bootstrapDns:
              - tcp+udp:1.1.1.1
              - tcp+udp:9.9.9.9

            # static records for hosts outside the cluster. Resolved above the
            # conditional forward below, so these win; every other name under
            # the domain still falls through to k8s-gateway.
            customDNS:
              mapping:
                analytics.${SECRET_DOMAIN}: 192.168.100.11
                auth.${SECRET_DOMAIN}: 192.168.100.11
                budget.${SECRET_DOMAIN}: 192.168.100.11
                budget-tap.${SECRET_DOMAIN}: 192.168.100.11
                budget-tap-pz.${SECRET_DOMAIN}: 192.168.100.11
                dash.${SECRET_DOMAIN}: 192.168.100.11
                feed.${SECRET_DOMAIN}: 192.168.100.11
                forge.${SECRET_DOMAIN}: 192.168.100.11
                idp-home.${SECRET_DOMAIN}: 192.168.100.11
                pf.${SECRET_DOMAIN}: 192.168.100.11
                portfolio-staging.${SECRET_DOMAIN}: 192.168.100.11
                prx-home.${SECRET_DOMAIN}: 192.168.100.11
                pz8-home.${SECRET_DOMAIN}: 192.168.100.11
                sure.${SECRET_DOMAIN}: 192.168.100.11
                whoami-home.${SECRET_DOMAIN}: 192.168.100.11
                pve1.lan.${SECRET_DOMAIN}: 192.168.1.3

            conditional:
              # a miss stays a miss, never leaks the internal name to Cloudflare
              fallbackUpstream: false
              mapping:
                ${SECRET_DOMAIN}: 192.168.100.103

            blocking:
              denylists:
                main:
                  - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.txt
                  - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.txt
                  - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/fake.txt
              allowlists:
                main: []
              clientGroupsBlock:
                default:
                  - main
              blockType: zeroIp
              loading:
                refreshPeriod: 4h
                # serve while lists are still downloading
                strategy: fast
                downloads:
                  # the wildcard lists are large, 60s is not enough
                  timeout: 4m
                  attempts: 3
                  cooldown: 10s

            caching:
              minTime: 5m
              maxTime: 30m
              prefetching: true

            prometheus:
              enable: true
              path: /metrics

            ports:
              dns:
                - 5353
              http:
                - 4000

            queryLog:
              type: console

            log:
              level: info
              format: json

    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config.yml
            subPath: config.yml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
