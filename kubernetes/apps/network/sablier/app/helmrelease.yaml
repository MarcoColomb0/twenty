---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sablier
spec:
  chartRef:
    kind: OCIRepository
    name: sablier
  interval: 1h
  values:
    controllers:
      sablier:
        # One replica on purpose. Sablier holds its sessions in memory, so a
        # second would keep its own idea of what is awake and the two would
        # fight over the replica count. It is not on the request path -- the
        # Wasm filter in Envoy is -- so losing it briefly means routes it
        # guards stop waking, not that traffic stops.
        strategy: Recreate
        serviceAccount:
          # Declared in rbac.yaml rather than generated by the chart, so the
          # ClusterRoleBinding names something whose name cannot move. The key
          # belongs on the controller; at the top level `serviceAccount` is a
          # map of accounts for the chart to create.
          name: sablier
        containers:
          app:
            image:
              repository: ghcr.io/sablierapp/sablier
              tag: 1.18.0
            env:
              SABLIER_PROVIDER_NAME: kubernetes
              SABLIER_SERVER_PORT: &port 10000
              SABLIER_LOGGING_LEVEL: info
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
