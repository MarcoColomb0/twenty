---
# This route exists to make Envoy Gateway materialise a cluster for Sablier,
# not to publish it.
#
# The Wasm plugin reaches Sablier with dispatch_http_call, which takes an
# Envoy *cluster name* rather than a hostname. Envoy Gateway only builds
# clusters for backends some route references, so without this the call fails:
#   dipatch httpcall failed: error status returned by host: bad argument
# and the generated name is what the policy's `cluster` field has to match:
#   httproute/network/sablier/rule/0
#
# It attaches to BOTH gateways because a cluster only exists on the proxy whose
# route references it, and dispatch_http_call resolves within the proxy running
# the filter. drive.${SECRET_DOMAIN} is on envoy-external while collabora's
# route is on envoy-internal, so the policy runs on both and both need the
# cluster. Attached to one, the other still fails with `bad argument`.
#
# The path match is deliberately something nothing serves, and external-dns is
# told to ignore the route so attaching to the public gateway publishes no
# record. dispatch_http_call goes straight to the cluster and never traverses
# the listener or this route, so neither restriction costs anything -- and
# Sablier's API, which can stop and start workloads with no authentication of
# its own, stays unreachable from outside.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sablier
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  hostnames:
    - "sablier.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /__cluster-anchor
      backendRefs:
        - name: sablier
          port: 10000
