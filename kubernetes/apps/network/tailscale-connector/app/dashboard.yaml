---
# Picked up by the kube-prometheus-stack Grafana sidecar, which watches every
# namespace for ConfigMaps carrying the grafana_dashboard label -- so the
# dashboard lives beside the workload it describes instead of in the chart's
# values. The folder annotation lands it next to the dashboards the chart
# downloads by URL.
#
# No dollar-brace placeholders appear below, deliberately: this Kustomization
# runs postBuild substitution, and Flux rewrites that syntax anywhere in the
# manifest, ConfigMap literals included -- a Grafana datasource variable written
# the usual way would be replaced with an empty string. The datasource is
# referenced by uid instead, and Grafana's own $__rate_interval is brace-free
# and survives untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-dashboard
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana_folder: "Cluster Apps"
data:
  tailscale.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Subnet routers ready",
          "description": "Replicas of the Connector StatefulSet that are Ready. Two is the design: Tailscale fails a subnet route over to the surviving advertiser, so one is degraded rather than broken.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(kube_statefulset_status_replicas_ready{namespace=\"network\", statefulset=~\"ts-home-.+\"})",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Routes awaiting approval",
          "description": "Advertised minus approved. Non-zero means a route is being announced that the tailnet has not accepted, so remote devices cannot reach the LAN through it -- normally an autoApprovers miss in the policy file.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "clamp_min(max(tailscaled_advertised_routes{ts_proxy_type=\"connector\"}) - min(tailscaled_approved_routes{ts_proxy_type=\"connector\"}), 0)",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Health warnings",
          "description": "tailscaled's own health checks. Leads the failure: warnings appear here before routing actually breaks.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max(tailscaled_health_messages{ts_proxy_type=\"connector\"})",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Direct path share (15m)",
          "description": "Share of bytes on a direct peer-to-peer path rather than relayed through a DERP server. Low means NAT traversal is failing and every packet is taking a detour through Tailscale's infrastructure -- it works, but latency and throughput suffer.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (\n  sum(rate(tailscaled_inbound_bytes_total{ts_proxy_type=\"connector\", path=~\"direct_.*\"}[15m]))\n  + sum(rate(tailscaled_outbound_bytes_total{ts_proxy_type=\"connector\", path=~\"direct_.*\"}[15m]))\n) / clamp_min(\n  sum(rate(tailscaled_inbound_bytes_total{ts_proxy_type=\"connector\"}[15m]))\n  + sum(rate(tailscaled_outbound_bytes_total{ts_proxy_type=\"connector\"}[15m])),\n  0.001\n)",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Inbound throughput by path",
          "description": "Traffic arriving from the tailnet, split by how it got here. derp is relayed; direct_* is peer-to-peer.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (path) (rate(tailscaled_inbound_bytes_total{ts_proxy_type=\"connector\"}[$__rate_interval]))",
              "legendFormat": "{{path}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 30,
                "showPoints": "never",
                "pointSize": 8,
                "gradientMode": "none",
                "spanNulls": false,
                "axisPlacement": "auto",
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "lineInterpolation": "linear"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "derp"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "direct_ipv4"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "direct_ipv6"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "peer_relay_ipv4"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#c98500"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "peer_relay_ipv6"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d55181"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Outbound throughput by path",
          "description": "Traffic sent to the tailnet, split by path. This is LAN data leaving for a remote device.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (path) (rate(tailscaled_outbound_bytes_total{ts_proxy_type=\"connector\"}[$__rate_interval]))",
              "legendFormat": "{{path}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 30,
                "showPoints": "never",
                "pointSize": 8,
                "gradientMode": "none",
                "spanNulls": false,
                "axisPlacement": "auto",
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "lineInterpolation": "linear"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "derp"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "direct_ipv4"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "direct_ipv6"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "peer_relay_ipv4"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#c98500"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "peer_relay_ipv6"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d55181"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Packet rate by path",
          "description": "Inbound and outbound packets combined. Reads differently from bytes when the traffic is DNS -- many small packets, almost no volume.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (path) (\n  rate(tailscaled_inbound_packets_total{ts_proxy_type=\"connector\"}[$__rate_interval])\n  + rate(tailscaled_outbound_packets_total{ts_proxy_type=\"connector\"}[$__rate_interval])\n)",
              "legendFormat": "{{path}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 30,
                "showPoints": "never",
                "pointSize": 8,
                "gradientMode": "none",
                "spanNulls": false,
                "axisPlacement": "auto",
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "lineInterpolation": "linear"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "derp"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "direct_ipv4"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "direct_ipv6"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "peer_relay_ipv4"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#c98500"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "peer_relay_ipv6"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d55181"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Dropped packets by reason",
          "description": "Packets tailscaled refused to send. unknown_protocol is routine background noise on a LAN; a sustained error rate is not.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (reason) (rate(tailscaled_outbound_dropped_packets_total{ts_proxy_type=\"connector\"}[$__rate_interval]))",
              "legendFormat": "{{reason}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "gradientMode": "none",
                "spanNulls": false,
                "axisPlacement": "auto",
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "lineInterpolation": "linear"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "error"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "unknown_protocol"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "table",
          "title": "Per-router state",
          "description": "One row per subnet router. The table view is also what carries identity when colour alone will not -- printed, in forced-colours mode, or for a reader who cannot separate the yellow and orange paths.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (pod) (tailscaled_advertised_routes{ts_proxy_type=\"connector\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (pod) (tailscaled_approved_routes{ts_proxy_type=\"connector\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (pod) (tailscaled_health_messages{ts_proxy_type=\"connector\", type=\"warning\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (pod) (tailscaled_home_derp_region_id{ts_proxy_type=\"connector\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "D"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {},
                "renameByName": {
                  "pod": "Router",
                  "Value #A": "Advertised routes",
                  "Value #B": "Approved routes",
                  "Value #C": "Health warnings",
                  "Value #D": "DERP region id"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Health warnings"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false,
              "fields": ""
            }
          }
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "tailscale",
        "network"
      ],
      "templating": {
        "list": []
      },
