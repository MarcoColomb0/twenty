---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pz8
spec:
  chartRef:
    kind: OCIRepository
    name: pz8
  interval: 1h
  values:
    controllers:
      pz8:
        # prx holds a ReadWriteOnce volume, so two pods must never overlap.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # A native sidecar: the kubelet starts it first, holds the other two
          # until its startup probe passes, and keeps it running for the life
          # of the pod. Everything shares its network namespace, so the other
          # containers have no interface of their own and no route except the
          # tunnel. Its firewall rules outlive the container, so a dead tunnel
          # drops packets rather than falling back to the node's default route.
          net:
            image:
              repository: ${PZ8NET_IMAGE}
              tag: ${PZ8NET_TAG}
            restartPolicy: Always
            envFrom:
              - secretRef:
                  name: pz8-net
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  # Not a tcpSocket probe: the killswitch drops everything
                  # arriving on a port that was not explicitly opened, so a
                  # probe from the kubelet can never reach the control server
                  # and the sidecar would hang at started=false forever. Run
                  # the image's own healthcheck instead -- it tests the tunnel
                  # rather than a listening socket, and needs nothing open.
                  exec:
                    command:
                      - "/gluetun-entrypoint"
                      - "healthcheck"
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
                # Required to create the interface and install the firewall
                # rules that are the killswitch.
                add:
                  - "NET_ADMIN"
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ${PZ8_IMAGE}
              tag: ${PZ8_TAG}
            # SOPS encrypts values but never key names, so an envFrom Secret
            # would publish the whole variable list. The mounted script holds
            # the exports and the exec line, and all of it is ciphertext.
            command:
              - /bin/sh
              - /var/run/pz8/run
            probes:
              # tcpSocket rather than httpGet: a path here would describe the
              # workload, which is the one thing this deployment must not do.
              liveness: &appProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &appPort 7860
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *appProbes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
          prx:
            image:
              repository: ${PZ8PRX_IMAGE}
              tag: ${PZ8PRX_TAG}
            # The image's entrypoint starts a tunnel client of its own before
            # handing over, and it has no off switch -- the branch it takes
            # when the mode is not its userspace one is the official daemon,
            # which then fails with "Registration Missing due to: Daemon
            # Startup" and costs 25s of every start. Egress is already handled
            # for the whole pod, so skip the wrapper and start the app the way
            # the entrypoint's last two lines do.
            command:
              - /bin/sh
              - -c
              - cd /app && PYTHONPATH=/app exec python app.py
            env:
              # Both images default to 7860 and share one network namespace,
              # so the second one has to move. app reaches it on loopback.
              PORT: &prxPort 7861
            envFrom:
              - secretRef:
                  name: pz8prx-env
            probes:
              liveness: &prxProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *prxPort
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *prxProbes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # Without this the other containers keep the cluster resolver, and every
      # lookup would leave through the LAN resolver outside the tunnel while
      # the traffic itself went through it. Nothing here needs cluster DNS --
      # the only cross-container call is over loopback.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "127.0.0.1"
        options:
          - name: ndots
            value: "1"
      securityContext:
        # One image starts as its own unprivileged user and the other as root,
        # so neither can be forced here without breaking one of them.
        runAsNonRoot: false
    persistence:
      data:
        existingClaim: pz8prx-data
        advancedMounts:
          pz8:
            prx:
              - path: /data
      # The sidecar caches its state here and cannot write to the image's own
      # filesystem: "persisting public ip address: open /tmp/gluetun/ip:
      # permission denied".
      netstate:
        type: emptyDir
        advancedMounts:
          pz8:
            net:
              - path: /tmp/gluetun
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          pz8:
            net:
              - path: /dev/net/tun
      runtime:
        type: secret
        name: pz8-env
        advancedMounts:
          pz8:
            app:
              - path: /var/run/pz8
                readOnly: true
    service:
      app:
        ports:
          http:
            port: *appPort
      prx:
        controller: pz8
        ports:
          http:
            port: *prxPort
    route:
      app:
        hostnames:
          - "pz8.${SECRET_DOMAIN}"
        # Internal gateway only. cloudflare-dns watches envoy-external alone,
        # so nothing here can reach public DNS.
        parentRefs: &internal
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *appPort
      prx:
        hostnames:
          - "pz8prx.${SECRET_DOMAIN}"
        parentRefs: *internal
        rules:
          - backendRefs:
              - identifier: prx
                port: *prxPort
