---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pz8prx-data
  annotations:
    resize.topolvm.io/storage_limit: 20Gi
    resize.topolvm.io/threshold: 20%
    resize.topolvm.io/increase: 20%
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
