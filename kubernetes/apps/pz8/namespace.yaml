---
apiVersion: v1
kind: Namespace
metadata:
  name: pz8
  labels:
    # The egress sidecar needs NET_ADMIN and a hostPath char device, both of
    # which the baseline policy refuses. Set from the start so adding the
    # sidecar later is a workload change only.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
