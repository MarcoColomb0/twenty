---
# The ETAPI token Prometheus authenticates /etapi/metrics with.
#
# It cannot be declared ahead of the instance: tokens are minted by
# POST /etapi/auth/login, which verifies the account password, and the password
# itself is only set through the first-run setup wizard. Nothing seeds it from
# the environment.
#
# Once the wizard is done, mint one and replace the value below:
#
#   kubectl -n trilium port-forward svc/trilium 8080:8080 &
#   curl -s -X POST http://127.0.0.1:8080/etapi/auth/login \
#     -H 'Content-Type: application/json' \
#     -d '{"password":"<the password you set>","tokenName":"prometheus"}'
#   sops kubernetes/apps/trilium/trilium/app/secret.sops.yaml
#
# Until then the scrape returns 401 and the target reads as down. Every login
# call mints a *new* token, so revoke the old one in Options -> ETAPI if this is
# ever re-run.
apiVersion: v1
kind: Secret
metadata:
  name: trilium-etapi
type: Opaque
stringData:
  token: ENC[AES256_GCM,data:CVBGQdowoMtJXu9I+30XpQU7Kc3AWs9L4GE+Hw==,iv:J5HU1GhkVRXy9OOnXfx1kZwfzb7P9w50Gb4ejxFYEng=,tag:Jkv8Z49BezFD8qqKbp5HUQ==,type:str]
sops:
  age:
    - enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBnN2JUcm5sUFpZYlVyaUk1
        ZVgzeHNnNEdLanVVTTRzZFY5dDBUQ1lqUnpZCmJVTW5wekJtMXpWQ2xUOExkQnJw
        ZjNQYUt2cTFPUzdJUTlpdC9PaVpzUmMKLS0tIFlxRE5adHdRYXV2MzNma3J5b2tl
        UGI0NmlIdTF3eTVmUEhURDl3Y3hzWmcKumkK9g5KIK84jMXc1CYHyxS0AqcVy8tD
        h7Okx3Rtyb2wZ7/88sxe3pJaVLL4zyXDXxkPEXxiULmvX4iwu7y1Dw==
        -----END AGE ENCRYPTED FILE-----
      recipient: age1txcyeza70lxefaz3m45jxyf074czteej3z843js7z9fh8ndv5pxqll2tex
