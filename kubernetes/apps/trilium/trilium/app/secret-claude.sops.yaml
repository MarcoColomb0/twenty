---
# The long-lived Claude subscription token Trilium's Claude Agent provider
# authenticates with. This is a Claude Pro/Max subscription credential, not an
# Anthropic API key -- usage is billed to the subscription, not to API credit.
#
# Mint it on a machine that is already signed in to the subscription:
#
#   claude setup-token
#
# then put the sk-ant-oat01-... value here:
#
#   sops kubernetes/apps/trilium/trilium/app/secret-claude.sops.yaml
#
# The key is read straight from the environment by the CLI, so nothing is
# written to disk and no interactive `claude /login` inside the pod is needed.
# The secretKeyRef is optional: until this holds a real token the pod still
# starts and only the AI features fail.
apiVersion: v1
kind: Secret
metadata:
  name: trilium-claude
type: Opaque
stringData:
