---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trilium
spec:
  chartRef:
    kind: OCIRepository
    name: trilium
  interval: 1h
  values:
    controllers:
      trilium:
        # SQLite on a single ReadWriteOnce volume, so two pods must never run at
        # once -- a rolling update would deadlock on the attach anyway.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Trilium's Claude subscription provider runs in "bring-your-own-binary"
          # mode: the SDK's own ~250 MB native binary is stripped at Trilium's
          # install time, and claude_binary.ts resolves the CLI from
          # TRILIUM_CLAUDE_CODE_PATH instead. The image ships no such binary, so
          # it is installed here into a shared emptyDir on every pod start.
          #
          # Same image as the app rather than a node image of its own: it already
          # carries the matching node and npm, and spegel has it cached on the
          # node. ~208 MB and ~20 s, and the platform binary arrives as a normal
          # optionalDependency (@anthropic-ai/claude-code-linux-x64), so the
          # package's postinstall script never has to run.
          install-claude:
            image:
              repository: docker.io/triliumnext/trilium
              tag: v0.105.0
            command:
              - "sh"
              - "-c"
              - "exec npm install -g --prefix /claude @anthropic-ai/claude-code@2.1.278"
            env:
              # npm writes a cache and a logs directory under $HOME, which is
              # read-only here like every other path outside the mounts.
              HOME: /tmp
              npm_config_cache: /tmp/npm-cache
              npm_config_update_notifier: "false"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        containers:
          app:
            image:
              repository: docker.io/triliumnext/trilium
              tag: v0.105.0
            # Upstream's entrypoint (start-docker.sh) starts as root purely to
            # usermod/chown the data directory before dropping to node via su,
            # and no rootless image is published to Docker Hub. fsGroup below
            # already makes the volume group-writable, so the container is
            # started at its final identity instead and the script is skipped.
            # The consequence to watch: anything upstream later adds to that
            # script will not run here.
            #
            # The glob is deliberate. The entry point is main.cjs in v0.105.0
            # and has already been renamed to main.mjs upstream, so naming
            # either one pins this to a single release and crashloops on the
            # Renovate bump that crosses the rename -- which is how it landed
            # broken the first time. "?" matches the one character that
            # actually changes, and only ever one of the two files exists.
            command:
              - "sh"
              - "-c"
              - "exec node ./main.?js"
            env:
              # Must match the persistence mount below. Also where config.ini is
              # written on first boot, and where the healthcheck-url file lands.
              TRILIUM_DATA_DIR: &dataDir /home/node/trilium-data
              TRILIUM_NETWORK_HOST: 0.0.0.0
              TRILIUM_NETWORK_PORT: &port 8080
              # Express otherwise reads the socket peer, which is always the
              # Envoy pod, so every login attempt shares one address. A CIDR
              # rather than "true": "true" takes the leftmost X-Forwarded-For
              # entry, which is whatever the client sent and therefore forgeable
              # -- the same trap already documented on Vaultwarden's IP_HEADER.
              TRILIUM_NETWORK_TRUSTEDREVERSEPROXY: "10.42.0.0/16"
              TRILIUM_GENERAL_NOAUTHENTICATION: "false"
              # Both default to false; set explicitly because this is published.
              # Backend scripts run with full server access -- child_process,
              # filesystem, network -- and the SQL console executes raw SQL
              # against the note database. Neither is needed to write notes.
              TRILIUM_SECURITY_BACKEND_SCRIPTING_ENABLED: "false"
              TRILIUM_SECURITY_SQL_CONSOLE_ENABLED: "false"

              # -- Claude subscription provider --------------------------------
              #
              # Where the init container above put the CLI. Without this,
              # claude_binary.ts falls back to searching PATH and fails with
              # "Claude Code CLI not found".
              TRILIUM_CLAUDE_CODE_PATH: /claude/bin/claude
              # Authentication is the long-lived subscription token minted by
              # `claude setup-token`, not an API key and not a metered
              # Anthropic API credit. The alternative upstream documents is
              # running `claude` and `/login` interactively on the server, which
              # would mean exec-ing into the pod and keeping the resulting
              # credential on a volume; a token in SOPS is the same secret with
              # none of the state.
              #
              # The Secret ships alongside this release so the reference always
              # resolves -- app-template's schema rejects `optional` on a
              # secretKeyRef, and a missing Secret would otherwise hold the pod
              # in CreateContainerConfigError and take the notes down with it.
              # Until a real token is in there the AI features 401 and nothing
              # else is affected.
              CLAUDE_CODE_OAUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: trilium-claude
                    key: token
              # The CLI writes sessions, projects and a .claude.json into this
              # directory on every invocation, and $HOME is read-only. An
              # emptyDir on purpose rather than a path on the data volume: with
              # the token supplied through the environment there is nothing here
              # worth keeping across restarts, and nothing credential-shaped
              # lands in the VolSync backup.
              CLAUDE_CONFIG_DIR: /claude-config

              # -- SSO --------------------------------------------------------
              #
              # These three variables only *configure* OpenID. They do not turn
              # it on: isOpenIDConfigured() additionally requires the mfaMethod
              # option to be 'oauth', which is a setting inside Trilium, and
              # isOpenIDEnabled() further requires an enrolled subject. So the
              # first boot still shows the password form -- by design, since
              # afterCallback refuses to bind an identity unless the request
              # already carries a logged-in session. A stranger cannot claim the
              # instance by being first to authenticate.
              #
              # After enrollment the login page offers the provider button and
              # any other identity is rejected as "wrong_account". The password
              # is not deleted and stays the break-glass path, the same posture
              # as Vaultwarden's SSO_ONLY=false.
              TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHBASEURL: https://notes.${SECRET_DOMAIN}
              # Issuer URL, not the .well-known path.
              TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERBASEURL: https://id.${SECRET_DOMAIN}
              # Default is "Google", which would mislabel the login button.
              TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERNAME: Pocket ID
              TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTID:
                valueFrom:
                  secretKeyRef:
                    name: &oidc trilium-oidc
                    key: client_id
              TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: *oidc
                    key: client_secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # The same endpoint the image's own HEALTHCHECK probes, and
                    # the one route registered with an empty middleware list, so
                    # it answers 200 without a session.
                    path: /api/health-check
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health-check
                    port: *port
                  # First boot creates the schema and copies config-sample.ini
                  # into the data directory before it binds.
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 384Mi
              # Raised from 1Gi: a chat turn spawns the Claude Code CLI as a
              # child of this container, so the agent's memory counts against
              # the same limit as the note server.
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # node:24 in the base image. Matching it keeps the files the container
        # writes owned by the identity the image expects.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: trilium-data
        globalMounts:
          - path: *dataDir
      # readOnlyRootFilesystem above leaves nothing else writable, and node
      # falls back to os.tmpdir() for uploads and extraction.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # Written by the init container, read by the app container.
      claude:
        type: emptyDir
        globalMounts:
          - path: /claude
      claude-config:
        type: emptyDir
        globalMounts:
          - path: /claude-config
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "notes.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
