# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ghostfolio-dragonfly
spec:
  replicas: 1
  args:
    # One thread, matching immich. Dragonfly reserves 256MiB per
    # proactor and refuses to start when maxmemory (80% of the limit) cannot
    # cover them all, so three threads needed 768MiB and forced the 1Gi limit
    # below -- and with it a 1Gi reservation for a cache that uses under 25Mi.
    # Ghostfolio uses this as a cache, not a data store.
    - --proactor_threads=1
    - --default_lua_flags=allow-undeclared-keys
    - --cluster_mode=emulated
  resources:
    requests:
      cpu: 200m
    limits:
      memory: 512Mi
