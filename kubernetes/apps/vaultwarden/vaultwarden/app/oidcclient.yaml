---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: vaultwarden
spec:
  # Vaultwarden derives this path from DOMAIN and it cannot be configured
  # separately, so it has to match exactly.
  callbackUrls:
    - https://vault.${SECRET_DOMAIN}/identity/connect/oidc-signin
  logoutCallbackUrls:
    - https://vault.${SECRET_DOMAIN}
  pkceEnabled: true
  skipConsent: true
  # Vaultwarden's SSO signup path checks SIGNUPS_DOMAINS_WHITELIST and the
  # provider's email_verified claim -- and nothing else. SIGNUPS_ALLOWED does
  # not apply to it, so every identity Pocket ID lets through would otherwise
  # get a vault. This group is the actual access list.
  allowedUserGroups:
    - name: vaultwarden-users
  secret:
    name: vaultwarden-oidc
    keys:
      clientID: client_id
      clientSecret: client_secret
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: vaultwarden-users
spec:
  # name defaults to metadata.name
  friendlyName: Vaultwarden Users
