---
# One-off import of a SwissTransfer bundle onto the SMB share, run at night.
#
# A CronJob rather than a Job because 50GB at the WAN ceiling saturates the
# line for over two hours -- uncapped by choice, since swissfer has no rate
# limit and pod-level ingress shaping is not available here (Cilium's bandwidth
# manager is egress-only and not enabled). Running it while the house is asleep
# is the cap.
#
# It is still an errand, not desired state: delete this directory once the
# transfer has landed and Flux prunes the CronJob with it. The completion
# marker below means a night that fires before you get round to that costs
# seconds, not another 50GB.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: swisstransfer-import
spec:
  # Local midnight. Without spec.timeZone this would be UTC, which is 02:00
  # local in summer -- the schedule would drift by an hour twice a year against
  # the hours the line is actually idle.
  schedule: "0 0 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  # A missed window (node reboot, controller restart) still runs if it is
  # noticed within the hour, rather than silently waiting a whole day.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # swissfer has no resume, so a retry restarts the whole transfer rather
      # than picking up where it stopped. Two attempts, then wait for the next
      # night rather than hammering the line in daylight.
      backoffLimit: 2
      # Six hours. Generous for ~50GB at 51 Mbit/s (about 2h15m), and a bound
      # so a wedged download cannot still be running at breakfast.
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              # samba-data is ReadWriteOnce, which means one *node*, not one
              # pod -- several pods may mount it while colocated. Following the
              # samba pod guarantees that and keeps working if samba is
              # rescheduled, unlike pinning a hostname.
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: samba
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            # Matches UID_mc on the samba container and "force user = mc" on
            # the share, so what lands is readable over SMB with no chown pass.
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: swissfer
              image: docker.io/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
              # Alpine rather than a purpose-built image because busybox
              # already has wget, tar and sha256sum, so nothing is installed at
              # runtime and there is no image to build for a job that runs
              # once. The CA bundle ships in the base image, which is what lets
              # both wget and swissfer reach swisstransfer.com.
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  if [ -z "${SWISSTRANSFER_LINK:-}" ]; then
                    echo "SWISSTRANSFER_LINK is empty -- fill it in the SOPS secret first." >&2
                    exit 1
                  fi

                  # Written only after a complete run, so an interrupted one
                  # never looks finished. Delete the destination directory to
                  # force a fresh download.
                  if [ -f "${DEST:?}/.swisstransfer-complete" ]; then
                    echo "${DEST} already complete -- nothing to do."
                    exit 0
                  fi

                  cd /tmp
                  echo "==> fetching swissfer ${SWISSFER_VERSION}"
                  wget -q -O swissfer.tar.gz \
                    "https://github.com/Blutsh/Swish/releases/download/${SWISSFER_VERSION}/swissfer-${SWISSFER_VERSION}-x86_64-unknown-linux-musl.tar.gz"

                  # Pinned by digest, not just by version: a release asset can
                  # be replaced in place, and this runs with write access to
                  # the share.
                  echo "${SWISSFER_SHA256}  swissfer.tar.gz" | sha256sum -c -

                  tar xzf swissfer.tar.gz
                  BIN="$(find . -name swissfer -type f | head -1)"
                  "${BIN}" --version

                  # Download into a staging directory and rename on success, so
                  # the destination only ever holds a complete set. Without
                  # this an interrupted run leaves a truncated file that looks
                  # like the real thing -- for a multi-part .7z that is not
                  # discovered until extraction fails.
                  rm -rf "${STAGING:?}"
                  mkdir -p "${STAGING}"

                  echo "==> downloading"
                  "${BIN}" --output "${STAGING}" "${SWISSTRANSFER_LINK}"

                  rm -rf "${DEST}"
                  mv "${STAGING}" "${DEST}"
                  touch "${DEST}/.swisstransfer-complete"

                  echo "==> done"
                  du -sh "${DEST}"
                  ls -la "${DEST}" | head -40
              env:
                - name: SWISSFER_VERSION
                  value: "3.0.0"
                - name: SWISSFER_SHA256
                  value: "35ac7f0d0dbcab0909a7d59648eec290a673defb5b175e4a76071216ce49af47"
                - name: DEST
                  value: /shares/data/swisstransfer
                - name: STAGING
                  value: /shares/data/.swisstransfer-incoming
                # The share link is a bearer credential -- anyone holding it
                # can download the transfer -- so it comes from the Secret
                # rather than this file, which is world-readable forever.
                - name: SWISSTRANSFER_LINK
                  valueFrom:
                    secretKeyRef:
                      name: swisstransfer-secret
                      key: SWISSTRANSFER_LINK
                # swissfer writes its last-used-email file under HOME. Only the
                # upload path reads it, but an unset HOME still makes it try
                # "/", which is read-only here.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  # Streaming to disk, so this is flat regardless of transfer
                  # size.
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /shares/data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: samba-data
            - name: tmp
              emptyDir: {}
