---
# One-off import of a SwissTransfer bundle straight onto the SMB share.
#
# Delete this directory once it has completed -- Flux prunes the Job with it.
# Leaving it costs nothing while it exists (a finished Job holds no resources),
# but it is not desired state, it is an errand.
apiVersion: batch/v1
kind: Job
metadata:
  name: swisstransfer-import
spec:
  # swissfer has no resume, so a retry restarts the whole transfer rather than
  # picking up where it stopped. Two attempts, then stop and look at why.
  backoffLimit: 2
  # Six hours. Generous for ~50GB uncapped, and a bound so a wedged download
  # cannot sit on the share's volume indefinitely.
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          # samba-data is ReadWriteOnce, which means one *node*, not one pod --
          # several pods may mount it as long as they are colocated. Following
          # the samba pod is what guarantees that, and it keeps working if
          # samba is rescheduled rather than pinning a hostname that goes
          # stale.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: samba
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        # Matches UID_mc on the samba container and "force user = mc" on the
        # share, so what lands here is readable over SMB without a chown pass.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: swissfer
          image: docker.io/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
          # Alpine rather than a purpose-built image because everything needed
          # is already in busybox -- wget, tar, sha256sum -- so nothing is
          # installed at runtime and there is no image to build and publish for
          # a job that runs once. The CA bundle ships in the base image, which
          # is what lets both wget and swissfer reach swisstransfer.com.
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              if [ -z "${SWISSTRANSFER_LINK:-}" ]; then
                echo "SWISSTRANSFER_LINK is empty -- fill it in the SOPS secret first." >&2
                exit 1
              fi

              cd /tmp
              echo "==> fetching swissfer ${SWISSFER_VERSION}"
              wget -q -O swissfer.tar.gz \
                "https://github.com/Blutsh/Swish/releases/download/${SWISSFER_VERSION}/swissfer-${SWISSFER_VERSION}-x86_64-unknown-linux-musl.tar.gz"

              # Pinned by digest, not just by version: a release asset can be
              # replaced in place, and this runs with write access to the share.
              echo "${SWISSFER_SHA256}  swissfer.tar.gz" | sha256sum -c -

              tar xzf swissfer.tar.gz
              BIN="$(find . -name swissfer -type f | head -1)"
              "${BIN}" --version

              mkdir -p "${DEST}"
              echo "==> downloading into ${DEST}"
              "${BIN}" --output "${DEST}" "${SWISSTRANSFER_LINK}"

              echo "==> done"
              du -sh "${DEST}"
              ls -la "${DEST}" | head -40
          env:
            - name: SWISSFER_VERSION
              value: "3.0.0"
            - name: SWISSFER_SHA256
              value: "35ac7f0d0dbcab0909a7d59648eec290a673defb5b175e4a76071216ce49af47"
            - name: DEST
              value: /shares/data/swisstransfer
            # The share link is a bearer credential -- anyone holding it can
            # download the transfer -- so it comes from the Secret rather than
            # this file, which is world-readable forever.
            - name: SWISSTRANSFER_LINK
              valueFrom:
                secretKeyRef:
                  name: swisstransfer-secret
                  key: SWISSTRANSFER_LINK
            # swissfer writes its last-used-email file under HOME. Only the
            # upload path reads it, but an unset HOME still makes it try "/".
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Streaming to disk, so this is flat regardless of transfer size.
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /shares/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: samba-data
        - name: tmp
          emptyDir: {}
