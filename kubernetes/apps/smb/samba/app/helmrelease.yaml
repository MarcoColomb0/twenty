---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: samba
spec:
  chartRef:
    kind: OCIRepository
    name: samba
  interval: 1h
  values:
    controllers:
      samba:
        # One ReadWriteOnce volume behind it, so two pods must never overlap.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # smbd only -- the avahi and wsdd variants exist to advertise the
              # server over mDNS/WS-Discovery, which needs host networking and
              # NET_ADMIN to be of any use. Clients here connect by name
              # through the LAN resolver instead.
              repository: ghcr.io/servercontainers/samba
              tag: smbd-only-latest@sha256:a789aa42c2e5db804fab5fb5dd5f2d4343a9a8a7789e4a191aab45e993c15d4f
            env:
              AVAHI_DISABLE: "true"
              WSDD2_DISABLE: "true"
              NETBIOS_DISABLE: "true"
              SAMBA_CONF_SERVER_STRING: samba
              # UID 1000 matches the VolSync mover, which runs as 1000:1000 and
              # has to read every file it backs up.
              UID_mc: "1000"
              # "restrict anonymous = 2" was here and was removed: it refuses
              # the anonymous IPC$ probe, but so does Samba's default
              # "map to guest = never", so removing it changed nothing. Left
              # out anyway because it only ever hid share *names* from an
              # unauthenticated lister, which the share's valid users already
              # made moot.
              #
              # Per-client log files below, because this image points log file
              # at /dev/stdout and nothing a connection does -- not a
              # successful session, not a rejected one -- ever appears there.
              # log.<client-ip> gets written even for a failed session setup,
              # so its absence proves the traffic never arrived.
              SAMBA_GLOBAL_STANZA: >-
                server min protocol = SMB3_00;
                server smb encrypt = required;
                log file = /var/log/samba/log.%m;
                max log size = 0;
                log level = 3 auth_audit:3;
                smb ports = 445;
                map to guest = never;
                load printers = no;
                printing = bsd;
                printcap name = /dev/null;
                disable spoolss = yes;
                vfs objects = catia fruit streams_xattr;
                fruit:metadata = stream;
                fruit:model = MacSamba;
                fruit:posix_rename = yes;
                fruit:zero_file_id = yes;
                fruit:veto_appledouble = no;
                fruit:wipe_intentionally_left_blank_rfork = yes;
                fruit:delete_empty_adfiles = yes
              # Two deliberate choices in the lists below.
              #
              # "*RECYCLE.BIN" rather than the real name: Flux runs envsubst
              # over this manifest, and a bare $RECYCLE would be read as a
              # variable and substituted away, leaving ".BIN" behind. The
              # wildcard matches the same directory without the sigil.
              #
              # Office lock files (~$doc.docx) are hidden, not vetoed. Word and
              # Excel create them to claim write ownership, so blocking them
              # outright makes documents open read-only.
              SAMBA_VOLUME_CONFIG_data: >-
                [data]; path = /shares/data; valid users = mc; guest ok = no;
                read only = no; browseable = yes; force user = mc;
                force group = mc; create mask = 0664; directory mask = 0775;
                veto files = /._*/.DS_Store/.Trashes/.TemporaryItems/.Spotlight-V100/.DocumentRevisions-V100/.fseventsd/.apdisk/.AppleDouble/.AppleDB/.AppleDesktop/Network Trash Folder/Temporary Items/lost+found/Thumbs.db/thumbs.db/ehthumbs.db/Desktop.ini/desktop.ini/*RECYCLE.BIN/System Volume Information/;
                delete veto files = yes;
                hide files = /~*/
            envFrom:
              # ACCOUNT_mc -- the image reads the account password from the
              # environment and never writes it anywhere readable.
              - secretRef:
                  name: samba-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 445
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # smbd starts as root and drops to the connecting account per session,
        # so it cannot run unprivileged. fsGroup is what lets that account own
        # the share contents on a freshly provisioned volume.
        runAsNonRoot: false
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: samba-data
        globalMounts:
          - path: /shares/data
    service:
      app:
        controller: samba
        type: LoadBalancer
        annotations:
          # The pool is the whole /24, so this has to be pinned or it can take
          # the address of a real host.
          lbipam.cilium.io/ips: "192.168.100.105"
          # k8s-gateway watches Services, so this resolves on the LAN only.
          # cloudflare-dns takes its records from CRDs and HTTPRoutes, never
          # from a Service, so nothing about this reaches public DNS.
          external-dns.alpha.kubernetes.io/hostname: "smb.${SECRET_DOMAIN}"
        externalTrafficPolicy: Cluster
        ports:
          smb:
            port: *port
            protocol: TCP
