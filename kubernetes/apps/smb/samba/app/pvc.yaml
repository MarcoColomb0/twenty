---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samba-data
  annotations:
    resize.topolvm.io/storage_limit: 150Gi
    resize.topolvm.io/threshold: 20%
    resize.topolvm.io/increase: 20%
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # 144Gi, not the 100Gi this was created at: pvc-autoresizer has grown the
      # volume as it filled, and a PVC request can never be lowered --
      #   spec.resources.requests.storage: Forbidden: field can not be less
      #   than status.capacity
      # which failed the whole Kustomization on every reconcile. Any volume
      # carrying the resize annotations above will drift this way, so the
      # manifest has to be caught up to the live size rather than the other way
      # round. Next time it grows, this number moves again.
      storage: 144Gi
