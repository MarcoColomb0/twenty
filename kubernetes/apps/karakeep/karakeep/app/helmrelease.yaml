---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  chartRef:
    kind: OCIRepository
    name: karakeep
  interval: 1h
  values:
    controllers:
      karakeep:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          # Upstream runs three services. They share a pod here rather than
          # three Deployments: both dependencies are addressed over localhost,
          # which keeps the crawler and the search index off the cluster network
          # entirely -- neither has any authentication worth exposing.
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: "0.32.0"
            env:
              DATA_DIR: /data
              MEILI_ADDR: http://localhost:7700
              BROWSER_WEB_URL: http://localhost:9222
              NEXTAUTH_URL: https://karakeep.${SECRET_DOMAIN}
              DISABLE_NEW_RELEASE_CHECK: "true"
            envFrom:
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 3000
                  initialDelaySeconds: 20
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                memory: 1Gi
          chrome:
            image:
              repository: gcr.io/zenika-hub/alpine-chrome
              tag: "124"
            args:
              # --no-sandbox because Chrome's own sandbox needs privileges this
              # pod does not have. It only ever loads pages Karakeep asks it to,
              # and it listens on localhost inside the pod.
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.41.0
            env:
              MEILI_NO_ANALYTICS: "true"
              MEILI_ENV: production
              MEILI_DB_PATH: /meili_data
            envFrom:
              - secretRef:
                  name: karakeep-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: karakeep-data
        advancedMounts:
          karakeep:
            app:
              - path: /data
      meili:
        existingClaim: karakeep-meili
        advancedMounts:
          karakeep:
            meilisearch:
              - path: /meili_data
      # Chrome writes far more to /tmp than the default 64MiB shared memory
      # allows, which is also why --disable-dev-shm-usage is set above.
      tmp:
        type: emptyDir
        advancedMounts:
          karakeep:
            chrome:
              - path: /tmp
    service:
      app:
        controller: karakeep
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "karakeep.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
