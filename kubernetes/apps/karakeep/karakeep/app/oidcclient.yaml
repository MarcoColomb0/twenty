---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: karakeep
spec:
  callbackUrls:
    # NextAuth builds this from the provider id, which Karakeep hardcodes as
    # "custom" regardless of OAUTH_PROVIDER_NAME -- that only sets the label on
    # the button.
    - https://karakeep.${SECRET_DOMAIN}/api/auth/callback/custom
  logoutCallbackUrls:
    - https://karakeep.${SECRET_DOMAIN}
  pkceEnabled: true
  skipConsent: true
  secret:
    name: karakeep-oidc
    keys:
      clientID: client_id
      clientSecret: client_secret
