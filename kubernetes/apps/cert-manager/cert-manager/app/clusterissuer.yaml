---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    privateKeySecretRef:
      name: letsencrypt-production
    # 6-day certificates. Chosen deliberately: a key that leaks is only useful
    # for days rather than months.
    #
    # This was briefly switched to "classic" while chasing a Firefox "connection
    # is not secure" error on Android, on the theory that the profile selected
    # the trust chain. It does not -- the chain follows from the certificate's
    # key algorithm, and ECDSA is what puts it under ISRG Root YE. The error
    # turned out to be stale client state and cleared with the browser's cache.
    #
    # Worth knowing when a renewal looks stuck: cert-manager solves the two
    # DNS-01 challenges for this wildcard one at a time, publishing a single TXT
    # at _acme-challenge, and its self-check can sit in backoff insisting the
    # record has not propagated when it plainly has. Deleting the Order restarts
    # it. At six days that renewal comes round roughly weekly.
    profile: shortlived
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-secret
              key: api-token
        selector:
          dnsZones:
            - "${SECRET_DOMAIN}"
