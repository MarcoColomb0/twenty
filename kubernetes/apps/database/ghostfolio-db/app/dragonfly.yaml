---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ghostfolio-dragonfly
spec:
  replicas: 2
  args:
    - --proactor_threads=2
    - --default_lua_flags=allow-undeclared-keys
    - --cluster_mode=emulated
  resources:
    requests:
      cpu: 100m
    limits:
      memory: 768Mi
