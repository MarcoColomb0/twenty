---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ghostfolio-db
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: dragonfly-operator
  interval: 1h
  path: ./kubernetes/apps/database/ghostfolio-db/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
