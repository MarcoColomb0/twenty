---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu
spec:
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
  interval: 1h
  values:
    name: intel-gpu
    # The chart would otherwise emit a NodeFeatureRule, which is a Node Feature
    # Discovery CRD. NFD is not installed here, so the manifest would fail to
    # apply on an unknown kind.
    nodeFeatureRule: false
    # nodeSelector is deliberately left at the chart default of
    # intel.feature.node.kubernetes.io/gpu=true. Helm merges maps rather than
    # replacing them, so adding a hostname here would not remove that key -- it
    # produced a selector requiring both, matching nothing, and the DaemonSet
    # sat at DESIRED=0. The label is set instead by machine.nodeLabels on
    # twenty-hp01 in talconfig.yaml, which is what NFD would have done. A future
    # node with an iGPU gets the plugin by carrying the same label.
    # One container at a time may hold the GPU. Raising this shares the render
    # node between pods, which is not wanted while Immich is its only consumer.
    sharedDevNum: 1
    enableMonitoring: true
