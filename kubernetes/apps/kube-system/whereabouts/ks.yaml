---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: whereabouts
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/whereabouts/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  # The IPAM behind the storage NetworkAttachmentDefinition: its CRDs and the
  # plugin binary have to exist before the first pod asks it for an address.
  wait: true
