---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: multus
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/multus/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  # NetworkAttachmentDefinitions elsewhere depend on this, and need the CRD and
  # a running daemon before they are any use.
  wait: true
