---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
spec:
  hostnames:
    - "hubble.${SECRET_DOMAIN}"
  parentRefs:
    # Internal only. hubble-ui has no authentication of any kind and exposes
    # every flow in the cluster, including service names and endpoint IPs.
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
