---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
# This route is the only thing that publishes the name. k8s-gateway
# watches HTTPRoutes and answers longhorn.${SECRET_DOMAIN} with the
# internal gateway's address on the LAN, which is the only place the
# address is reachable. There is deliberately no DNSEndpoint beside it:
# cloudflare-dns reads every DNSEndpoint in the cluster, and one holding
# a private address is a public record Cloudflare refuses to create.
spec:
  hostnames:
    - "longhorn.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: longhorn-frontend
          namespace: longhorn-system
          port: 80
