---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chartRef:
    kind: OCIRepository
    name: longhorn
  interval: 1h
  values:
    defaultSettings:
      defaultDataPath: /var/mnt/lh-storage
      replicaCount: 2
      storageReservedPercentageForDefaultDisk: 10
      storageMinimalAvailablePercentage: 10
      upgradeChecker: false
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultFsType: ext4
