---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
  interval: 1h
  values:
    defaultSettings:
      replicaCount: 2
      storageReservedPercentageForDefaultDisk: 10
      storageMinimalAvailablePercentage: 10
      # Longhorn schedules on a replica's *nominal* size, never on the bytes it
      # actually holds, and the claims here are declared far larger than they
      # will ever be: 473G nominal against 112G real, a factor of 4.2. At the
      # default 100% that arithmetic wedged twenty-hp01 -- 413G scheduled of the
      # 417G it is allowed to schedule, 4G left, while 284G of the disk sat
      # empty and unusable.
      #
      # 200% is a scheduling cap, not a reservation: it lets Longhorn place
      # replicas whose declared sizes exceed the disk, betting they stay as
      # sparse as they have been. storageMinimalAvailablePercentage above is the
      # backstop that makes the bet safe -- it stops writes with 10% of the disk
      # still free regardless of what was promised at schedule time.
      storageOverProvisioningPercentage: 200
      upgradeChecker: false
      # Longhorn puts a PodDisruptionBudget on each instance-manager with
      # minAvailable 1 against a single pod, so allowed=0 and it can never be
      # evicted. Under the default block-if-contains-last-replica that stops a
      # node drain dead whenever the node holds the only replica of something --
      # and every VolSync restic cache is single-replica by design, so whichever
      # node happens to host one blocks its own drain. tuppr retries and rolls
      # the cordon back every 12s, so an upgrade sits there looking busy forever.
      #
      # block-for-eviction-if-contains-last-replica evicts those replicas to
      # another node first and then allows the drain, which is what makes
      # unattended upgrades finish without a human deleting cache volumes.
      nodeDrainPolicy: block-for-eviction-if-contains-last-replica
      # Nothing was ever placed on twenty-lp01 after it joined: 20 replicas on
      # asus01, 22 on hp01, 0 on lp01. least-effort only rebalances under
      # pressure, so every volume kept both copies on the same two nodes and
      # draining either one dropped the lot to a single replica.
      #
      # best-effort did not fix that: it balances each volume on its own, and a
      # volume with its two replicas on two different nodes is already balanced
      # by that measure. Nothing in Longhorn evens out replica counts across
      # nodes; replicaReplenishmentWaitInterval below is what stops the skew.
      replicaAutoBalance: best-effort
      # How long a failed replica is waited for before Longhorn rebuilds it on
      # another node. At the default 600s any reboot longer than ten minutes
      # moved every attached volume off the rebooted node for good -- lp01 was
      # down 18 minutes on 2026-11-14 and came back holding only detached
      # VolSync caches, 12 replicas against 45 and 43. Waiting past a reboot
      # lets the node's own replicas resync in place instead. The cost is a
      # node that really dies leaves volumes single-replica for 30 minutes.
      replicaReplenishmentWaitInterval: 1800
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultFsType: ext4
    metrics:
      serviceMonitor:
        enabled: true
