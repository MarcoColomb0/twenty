---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
  interval: 1h
  values:
    defaultSettings:
      replicaCount: 2
      storageReservedPercentageForDefaultDisk: 10
      storageMinimalAvailablePercentage: 10
      upgradeChecker: false
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultFsType: ext4
    metrics:
      serviceMonitor:
        enabled: true
