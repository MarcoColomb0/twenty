---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  interval: 1h
  values:
    # Kubernetes does not ship the VolumeSnapshot CRDs or their controller;
    # Longhorn only provides the CSI sidecars that talk to them. Without this,
    # nothing in the cluster can take a snapshot, and VolSync would have to read
    # a live ReadWriteOnce volume out from under the running app.
    installCRDs: true
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
