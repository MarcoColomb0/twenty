---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chart:
    spec:
      chart: crowdsec
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: crowdsec
  interval: 1h
  values:
    # Talos runs containerd, so pod logs are in CRI format
    container_runtime: containerd

    config:
      parsers:
        s02-enrich:
          # Every 403 the external gateway emits is the bouncer's own ext_authz
          # denial -- checked against the access logs, not one came from an
          # upstream app. Without this they are parsed as ordinary client
          # requests, and since a banned client keeps browsing, its denials pile
          # up as distinct 4xx paths and overflow http-probing (capacity 10).
          # The ban then renews itself forever from evidence CrowdSec generated.
          #
          # Dropping them loses nothing: the decision that caused the denial was
          # already made from real traffic. Counting the block as fresh proof of
          # the behaviour it blocked is just double counting.
          #
          # The envoy parser unmarshals the whole JSON line, so the field is
          # reachable here even though it is not mapped into evt.Parsed. The nil
          # check short-circuits on lines that were not JSON, where the envoy key
          # is absent and dereferencing it would throw.
          twenty-ext-authz-whitelist.yaml: |
            name: twenty/ext-authz-whitelist
            description: "Do not feed bouncer denials back into the scenarios"
            filter: "evt.Meta.log_type == 'http_access-log'"
            whitelist:
              reason: "blocked by the CrowdSec bouncer, not client behaviour"
              expression:
                - evt.Unmarshaled.envoy != nil && evt.Unmarshaled.envoy.response_code_details == "ext_authz_denied"

    agent:
      # Only the external gateway is worth watching: envoy-internal serves the
      # LAN, which is whitelisted anyway.
      acquisition:
        - namespace: network
          podName: envoy-external-*
          program: envoy
      env:
        # actual-budget-whitelist is a parser, not a collection -- it has no
        # collection wrapper on the hub, so it cannot go in COLLECTIONS below.
        # Actual fetches its own migration files over HTTP on startup, and
        # GET /data/migrations/*.sql looks exactly like someone probing for a
        # database dump. Without this the app bans itself from the external
        # gateway.
        - name: PARSERS
          value: >-
            crowdsecurity/cri-logs
            crowdsecurity/actual-budget-whitelist
        # yanis-kouidri/envoy pulls in crowdsecurity/base-http-scenarios and
        # crowdsecurity/http-cve as dependencies, so neither is listed here.
        # http-dos is not a dependency of anything and has to be explicit.
        - name: COLLECTIONS
          value: >-
            yanis-kouidri/envoy
            crowdsecurity/http-dos
            crowdsecurity/discord-crawler-whitelist
        # http-crawl-non_statics bans on 40 distinct non-static filenames per
        # source IP and hostname, leaking one per 0.5s. That fits a content site
        # being scraped; it does not fit a single-page app, which fires dozens of
        # distinct API paths on one page load. Measured from the access logs: one
        # visit produced 82 distinct filenames on id.marco.wf and 92-140 on
        # actual.marco.wf, against a capacity of 40. Real users on Italian
        # residential ISPs were banned just for opening the login page.
        #
        # It also self-sustained: once banned, the bouncer answers 403, and those
        # 403s are still parsed as non-static GETs, so the bucket refilled and
        # renewed the ban.
        #
        # It arrives as a dependency of crowdsecurity/base-http-scenarios via
        # yanis-kouidri/envoy, so it cannot be dropped from COLLECTIONS above.
        # DISABLE_SCENARIOS makes the entrypoint run "cscli scenarios remove".
        # Everything published here sits behind Pocket ID, so crawl detection was
        # buying very little; http-dos and the AppSec rules still apply.
        - name: DISABLE_SCENARIOS
          value: crowdsecurity/http-crawl-non_statics
      # NOTE: crowdsecurity/whitelists stays enabled on purpose. It whitelists
      # RFC1918, which is what stops a parsing mistake from banning the
      # cloudflared pod and taking every public service down with it.
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Per-machine panels in the CrowdSec dashboards read agent metrics, which
      # the chart exposes on 6060 but does not scrape by default.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    appsec:
      enabled: true
      configs:
        twenty-appsec-full.yaml: |
          name: twenty/appsec-full
          default_remediation: ban
          inband_rules:
            - crowdsecurity/base-config
            - crowdsecurity/vpatch-*
            - crowdsecurity/generic-*
            - crowdsecurity/crs
          outofband_rules:
            - crowdsecurity/experimental-*
          # CRS 920440 is "URL file extension is restricted by policy", and .sql
          # is on that list for good reason -- a .sql over HTTP is normally a
          # leaked dump. Actual Budget legitimately serves its schema migrations
          # that way and fetches ~40 of them on every load, so 920440 matched,
          # 949110 tripped on the accumulated anomaly score, and the WAF banned
          # real users for opening the app.
          #
          # Scoped as tightly as the hook allows: in-band only, that one vhost,
          # that one path prefix. Every other host keeps the extension policy,
          # and the rest of CRS still applies to /data/migrations itself.
          pre_eval:
            - filter: >-
                IsInBand == true && req.Host == "actual.${SECRET_DOMAIN}"
                && req.URL.Path startsWith "/data/migrations/"
              apply:
                - RemoveInBandRuleByID(920440)
      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          # One merged config rather than a list of hub ones. Both
          # crowdsecurity/virtual-patching and crowdsecurity/generic-rules pull
          # in crowdsecurity/base-config, and listing them together loads it
          # twice: "failed to compile the directive secrule: duplicated rule
          # id 100", which crashloops the pod. Naming each rule set once avoids
          # that while still loading all of them.
          appsec_config: twenty/appsec-full
          labels:
            type: appsec
      env:
        - name: COLLECTIONS
          value: >-
            crowdsecurity/appsec-virtual-patching
            crowdsecurity/appsec-generic-rules
            crowdsecurity/appsec-crs-inband
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    lapi:
      # Registers the envoy bouncer at startup from BOUNCER_KEY_envoy, and
      # enrolls into the CrowdSec console from ENROLL_KEY. Both live in the
      # SOPS secret because this repository is public.
      envFrom:
        - secretRef:
            name: crowdsec-bouncer-key
      env:
        - name: ENROLL_INSTANCE_NAME
          value: twenty
        - name: ENROLL_TAGS
          value: k8s talos homelab
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      persistentVolume:
        data:
          enabled: true
          storageClassName: longhorn
          size: 2Gi
        config:
          enabled: true
          storageClassName: longhorn
          size: 128Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
