---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crowdsec-appsec
spec:
  # Both of these fail OPEN: when they are gone the external gateway keeps
  # serving traffic with no inspection and no ban enforcement, and nothing
  # errors. A drain evicting the last replica is exactly how that happens
  # without anyone choosing it.
  #
  # Selectors are the chart's own labels (k8s-app/type), not the
  # app.kubernetes.io/* set -- a PodDisruptionBudget whose selector matches no
  # pods is accepted without complaint and protects nothing.
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: crowdsec
      type: appsec
      # There is deliberately no budget for crowdsec-lapi. It is a single replica that
      # owns two ReadWriteOnce volumes -- a SQLite database and its config -- so it
      # cannot be scaled out, and minAvailable: 1 against one pod yields allowed=0.
      # That is unsatisfiable rather than protective: it blocked every node drain for
      # days, with tuppr rolling the cordon back every 12s and the upgrade stuck in
      # Draining. A workload that already uses the Recreate strategy has accepted this
      # downtime anyway.
