---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
spec:
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  interval: 1h
  values:
    # Deprecated top-level block; the instance is configured under
    # pocket-id-instance below.
    instance:
      enabled: false

    pocket-id-instance:
      instance:
        enabled: true
        name: pocket-id
        serviceMonitor:
          enabled: true
        spec:
          appUrl: https://id.${SECRET_DOMAIN}

          # spec.image is a CRD *schema default*: the API server stamps it into
          # the stored object on first write and never revisits it. This instance
          # was created under operator 0.11.1 and stayed pinned to pocket-id
          # 2.11.0 through two operator bumps, because a field that is already
          # set is not re-defaulted when the CRD's default changes. Operator
          # 0.14.0 then added a hard floor of pocket-id v2.14.0 and halts the
          # process below it, so the app has to be moved first and explicitly.
          # Pinning it here also lets Renovate's kubernetes manager track
          # pocket-id directly instead of inheriting the operator's default.
          image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless

          encryptionKey:
            valueFrom:
              secretKeyRef:
                name: pocket-id-secret
                key: ENCRYPTION_KEY

          # Published by CNPG into this namespace by the pocket-id-db Kustomization
          databaseUrl:
            valueFrom:
              secretKeyRef:
                name: postgres-pocket-id-app
                key: uri

          # The operator hard-codes replicas: 1 and strategy: Recreate, which is
          # required: pocket-id refuses to start while another instance is live.
          deploymentType: Deployment

          # Enabling the managed route also gives TRUST_PROXY a sensible default
          # (private/loopback ranges) instead of trusting every X-Forwarded-For.
          route:
            enabled: true
            # hostnames omitted on purpose: the operator derives them from
            # appUrl above. The chart's schema validates hostnames against a
            # strict DNS regex, which the ${SECRET_DOMAIN} placeholder cannot
            # satisfy until Flux substitutes it.
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: envoy-external
                namespace: network
                sectionName: https

          analyticsDisabled: true
          versionCheckDisabled: true

          metrics:
            enabled: true

          logging:
            level: info
            json: true

          # SMTP is injected as env rather than via spec.smtp: that block only
          # supports valueFrom for `password`, so host/user/from/port would sit in
          # plaintext in this public repo. spec.env takes full secretKeyRef syntax,
          # so every value stays in the SOPS secret.
          env:
            - name: SMTP_ENABLED
              value: "true"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: SMTP_PORT
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: SMTP_FROM
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: SMTP_PASSWORD
            - name: SMTP_TLS
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: SMTP_TLS

          resources:
            requests:
              cpu: 10m
            limits:
              memory: 256Mi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        labels:
          grafana_dashboard: "1"
        # Grafana comes from kube-prometheus-stack, not grafana-operator, so the
        # sidecar picks the ConfigMap up by label and the CR is unused.
        grafanaDashboard:
          enabled: false
