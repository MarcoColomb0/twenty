---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-proxy-bouncer
spec:
  dependsOn:
    # needs the LAPI reachable and crowdsec-bouncer-key decrypted before the
    # bouncer can authenticate its first decision pull
    - name: crowdsec
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/security/envoy-proxy-bouncer/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  wait: true
