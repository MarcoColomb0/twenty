# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-pocket-id
spec:
  instances: 2
  storage:
    size: 2Gi
    storageClass: longhorn
  # Continuous WAL archiving. The ScheduledBackup takes base backups; this is
  # what lets recovery land between them rather than only on one.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: "pocket-id"
  # Without this the pods are BestEffort, which is the first thing the kubelet
  # evicts under node memory pressure -- so the database tier would be killed
  # before any of the apps in front of it. Requests below the limit rather than
  # equal to it, matching immich-db: a Postgres pinned at
  # request==limit is OOMKilled on a spike, and for a primary that is a
  # failover. Observed use here is 113-121Mi per instance.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: pocket-id
      owner: pocket-id
