# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-pocket-id
spec:
  instances: 2
  storage:
    size: 2Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: pocket-id
      owner: pocket-id
