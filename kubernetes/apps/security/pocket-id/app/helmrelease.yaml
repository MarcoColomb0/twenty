---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  chartRef:
    kind: OCIRepository
    name: pocket-id
  interval: 1h
  values:
    controllers:
      pocket-id:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: pocket-id-secret
        containers:
          app:
            image:
              # distroless variant: no shell, no PUID/PGID entrypoint, runs as uid 65532.
              # The PUID/PGID dance only exists for SQLite file ownership, which Postgres makes moot.
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.11.0-distroless
            env:
              APP_URL: https://id.${SECRET_DOMAIN}
              PORT: &port 1411
              # only envoy can reach the pod, so X-Forwarded-For is trustworthy here
              TRUST_PROXY: "true"
              ANALYTICS_DISABLED: "true"
              DB_CONNECTION_STRING:
                valueFrom:
                  secretKeyRef:
                    # published by CNPG into this namespace
                    name: postgres-pocket-id-app
                    key: uri
            envFrom:
              - secretRef:
                  name: pocket-id-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "/app/pocket-id"
                      - "healthcheck"
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

    service:
      app:
        controller: pocket-id
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "id.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      # nothing durable lives here now that state is in Postgres
      data:
        type: emptyDir
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
