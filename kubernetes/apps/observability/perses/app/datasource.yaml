---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-provisioning
data:
  # Mounted into Perses' provisioning folder, which it re-reads every
  # provisioning.interval and writes back over whatever is in its database.
  # The datasource therefore stays declared here: editing it in the UI is
  # undone on the next pass. Dashboards are not provisioned and live only in
  # the database on the volume, which VolSync backs up.
  #
  # proxy rather than directUrl: Perses relays the queries server-side, so the
  # browser never needs to reach Prometheus, which has no authentication.
  prometheus.yaml: |-
    kind: GlobalDatasource
    metadata:
      name: prometheus
    spec:
      display:
        name: Prometheus
      default: true
      plugin:
        kind: PrometheusDatasource
        spec:
          proxy:
            kind: HTTPProxy
            spec:
              url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
