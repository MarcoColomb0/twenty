---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: perses
spec:
  hostnames:
    - "perses.${SECRET_DOMAIN}"
  parentRefs:
    # Internal only, unlike the Grafana it replaces; remote access is the
    # Tailscale subnet router. Saving a dashboard is a PUT, which CRS 911100
    # blocks single-strike on the external gateway, and a 0.x server holding a
    # proxy to an unauthenticated Prometheus has no business on the internet.
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: perses
          port: 8080
