---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: perses
spec:
  hostnames:
    - "perses.${SECRET_DOMAIN}"
  parentRefs:
    # External. Every API path and the Prometheus proxy answer 401 without a
    # Pocket ID session, and allowedUserGroups on the OIDC client is what
    # decides who gets one. Saving or deleting a dashboard is a PUT or DELETE,
    # which CRS 911100 blocks single-strike, so the crowdsec AppSec config
    # removes that rule for this host.
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: perses
          port: 8080
