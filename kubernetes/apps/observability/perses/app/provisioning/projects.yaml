---
# One project per namespace, the same mapping perses-operator uses. A
# dashboard names its project in metadata.project; Perses refuses to provision
# a dashboard whose project does not exist.
- kind: Project
  metadata:
    name: network
  spec:
    display:
      name: network
- kind: Project
  metadata:
    name: storage
  spec:
    display:
      name: storage
- kind: Project
  metadata:
    name: database
  spec:
    display:
      name: database
- kind: Project
  metadata:
    name: security
  spec:
    display:
      name: security
- kind: Project
  metadata:
    name: kube-system
  spec:
    display:
      name: kube-system
- kind: Project
  metadata:
    name: flux-system
  spec:
    display:
      name: flux-system
- kind: Project
  metadata:
    name: system-upgrade
  spec:
    display:
      name: system-upgrade
