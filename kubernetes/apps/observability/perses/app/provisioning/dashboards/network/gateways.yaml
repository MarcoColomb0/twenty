              $ref: '#/spec/panels/memory'
          - x: 16
            "y": 0
            width: 8
            height: 7
            content:
              $ref: '#/spec/panels/conns'
          - x: 0
            "y": 7
            width: 8
            height: 7
            content:
              $ref: '#/spec/panels/heap'
          - x: 8
            "y": 7
            width: 8
            height: 7
            content:
              $ref: '#/spec/panels/restarts'
          - x: 16
            "y": 7
            width: 8
            height: 7
