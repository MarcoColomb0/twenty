---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-monitoring
spec:
  dependsOn:
    # needs the PrometheusRule CRD and the Grafana dashboard sidecar
    - name: kube-prometheus-stack
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/observability/backup-monitoring/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
