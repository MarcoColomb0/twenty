---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-dashboard
  labels:
    # The kube-prometheus-stack sidecar watches every namespace for this label
    # and ignores its value.
    grafana_dashboard: "1"
data:
  backups.json: |-
    {
      "title": "Backups",
      "uid": "twenty-backups",
      "tags": [
        "backup",
        "volsync",
        "cnpg"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "Volumes \u2014 VolSync / restic",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Volumes protected",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "count(volsync_volume_out_of_sync{role=\"source\"})",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Volumes overdue",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(volsync_volume_out_of_sync{role=\"source\"})",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Missed intervals (24h)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(increase(volsync_missed_intervals_total[24h])) or vector(0)",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Slowest run (last)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "max(volsync_sync_duration_seconds{quantile=\"0.5\"}) or max(volsync_sync_duration_seconds_sum / volsync_sync_duration_seconds_count)",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Total syncs",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(volsync_sync_duration_seconds_count{role=\"source\"})",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "table",
          "title": "Per volume",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "volsync_volume_out_of_sync{role=\"source\"}",
              "instant": true,
              "format": "table",
              "refId": "A"
            },
            {
              "expr": "volsync_sync_duration_seconds_count{role=\"source\"}",
              "instant": true,
              "format": "table",
              "refId": "B"
            },
            {
              "expr": "volsync_sync_duration_seconds_sum{role=\"source\"} / volsync_sync_duration_seconds_count{role=\"source\"}",
              "instant": true,
              "format": "table",
              "refId": "C"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "obj_name",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "__name__ 3": true,
                  "job": true,
                  "job 1": true,
                  "job 2": true,
                  "job 3": true,
                  "instance": true,
                  "instance 1": true,
                  "instance 2": true,
                  "instance 3": true,
                  "container": true,
                  "container 1": true,
                  "container 2": true,
                  "container 3": true,
                  "endpoint": true,
                  "endpoint 1": true,
                  "endpoint 2": true,
                  "endpoint 3": true,
                  "service": true,
                  "service 1": true,
                  "service 2": true,
                  "service 3": true,
                  "pod": true,
                  "pod 1": true,
                  "pod 2": true,
                  "pod 3": true,
                  "namespace 1": true,
                  "namespace 2": true,
                  "namespace 3": true,
                  "role": true,
                  "role 1": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Overdue"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "no",
                            "color": "green",
                            "index": 0
                          },
                          "1": {
                            "text": "YES",
                            "color": "red",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Runs"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #C"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Mean duration"
                  },
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "obj_name"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Volume"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "obj_namespace"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Namespace"
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Databases \u2014 CloudNativePG / barman-cloud",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Oldest WAL archive",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "max(time() - cnpg_pg_stat_archiver_last_archived_time)",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3600
                  },
                  {
                    "color": "red",
                    "value": 21600
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Oldest base backup",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "max(time() - (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0)) or vector(-1)",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "never",
                      "color": "red",
                      "index": 0
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "no backup yet",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93600
                  },
                  {
                    "color": "red",
                    "value": 172800
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "WAL archive failures",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(cnpg_pg_stat_archiver_failed_count) or vector(0)",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Clusters archiving",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "count(cnpg_pg_stat_archiver_last_archived_time)",
              "instant": true,
              "legendFormat": "{{obj_namespace}}{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "table",
          "title": "Per database",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "time() - cnpg_pg_stat_archiver_last_archived_time",
              "instant": true,
              "format": "table",
              "refId": "A"
            },
            {
              "expr": "barman_cloud_cloudnative_pg_io_last_available_backup_timestamp",
              "instant": true,
              "format": "table",
              "refId": "B"
            },
            {
              "expr": "cnpg_pg_stat_archiver_failed_count",
              "instant": true,
              "format": "table",
              "refId": "C"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "namespace",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "__name__ 3": true,
                  "job": true,
                  "job 1": true,
                  "job 2": true,
                  "job 3": true,
                  "instance": true,
                  "instance 1": true,
                  "instance 2": true,
                  "instance 3": true,
                  "container": true,
                  "container 1": true,
                  "container 2": true,
                  "container 3": true,
                  "endpoint": true,
                  "endpoint 1": true,
                  "endpoint 2": true,
                  "endpoint 3": true,
                  "service": true,
                  "service 1": true,
                  "service 2": true,
                  "service 3": true,
                  "pod": true,
                  "pod 1": true,
                  "pod 2": true,
                  "pod 3": true,
                  "namespace 1": true,
                  "namespace 2": true,
                  "namespace 3": true,
                  "role": true,
                  "role 1": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "WAL archived ago"
                  },
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Last base backup"
                  },
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "none yet",
                            "color": "red",
                            "index": 0
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #C"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Archive failures"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "namespace"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Namespace"
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "VolSync run duration",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "volsync_sync_duration_seconds_sum{role=\"source\"} / volsync_sync_duration_seconds_count{role=\"source\"}",
              "legendFormat": "{{obj_namespace}}/{{obj_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0
          }
        ]
      }
    }
