---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    crds:
      enabled: true

    # Talos exposes the control plane metrics endpoints via the patches in
    # talos/patches/controller/cluster.yaml, they are scraped as static endpoints
    # since the components run as static pods outside the Kubernetes API.
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    coreDns:
      enabled: true
    kubeDns:
      enabled: false
    # cilium runs with kubeProxyReplacement, Talos has cluster.proxy.disabled
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: true
      endpoints: &controlPlane
        - 192.168.100.201
        - 192.168.100.202
        - 192.168.100.203
      service:
        enabled: true
        port: 10257
        targetPort: 10257
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      endpoints: *controlPlane
      service:
        enabled: true
        port: 10259
        targetPort: 10259
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeEtcd:
      enabled: true
      endpoints: *controlPlane
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        scheme: http

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
        limits:
          # 7d peak 60Mi.
          memory: 192Mi

    prometheus:
      prometheusSpec:
        replicas: 1
        # Adopt the ServiceMonitors/PodMonitors that already live in this repo
        # (cilium, envoy-gateway, flux-operator, longhorn, echo) instead of only
        # the ones this chart labels itself.
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # 14d of samples was heading for roughly 10GiB on a 20Gi volume that
        # Longhorn replicates twice. retentionSize stays as the backstop; it
        # sits above what 5d can produce, so time is what actually governs.
        retention: 5d
        retentionSize: 18GB
        walCompression: true
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2Gi

    alertmanager:
      # Alerts had nowhere to go: the chart's default routes everything into a
      # "null" receiver, so the stack evaluated rules and then discarded the
      # result. That is also why nothing noticed Alertmanager itself being dead
      # for two days.
      config:
        route:
          receiver: ntfy
          # namespace included so a noisy cluster-wide alert splits into one
          # message per namespace instead of a single oversized one. Grouping
          # only by alertname is what let a KubePodNotReady batch grow past
          # ntfy's message limit and take the whole pipeline down with it.
          group_by:
            - alertname
            - job
            - namespace
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            # The two alerts that carry severity="none", and the only two that
            # exist to be dropped rather than read. Watchdog fires constantly by
            # design, as proof the pipeline works. InfoInhibitor fires whenever
            # any severity="info" alert is firing, and upstream's own
            # description says it "should be routed to a null receiver" -- it is
            # meant to be the source of an inhibit_rule, never a notification.
            #
            # The inhibit_rules this pairs with are not written here and are
            # not absent: `config` merges with the chart's defaults rather than
            # replacing them, so the rendered config carries four, including
            # `source alertname="InfoInhibitor" -> target severity="info"`.
            # Only the route was missing, which is why InfoInhibitor reached
            # ntfy. Read the rendered config, not this block:
            #
            #   amtool config show --alertmanager.url=http://localhost:9093
            #
            # Those rules are inert here anyway: the route below drops
            # severity="info" outright, so there is nothing left for them to
            # inhibit. That is deliberate and strictly quieter than the pattern
            # InfoInhibitor exists for, which would *deliver* info alerts once a
            # warning or critical joined them in the same namespace. Given
            # ntfy's message limit has already taken this pipeline down once,
            # the blanket drop stays.
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
            - receiver: "null"
              matchers:
                - severity = "info"
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              # ntfy ships a template for Alertmanager's payload, so no
              # translating sidecar is needed to make this readable.
              - url: http://ntfy.observability.svc.cluster.local/alerts?template=alertmanager
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    # Mounted by alertmanagerSpec.secrets below. The token stays
                    # in SOPS rather than being written into this file.
                    credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy-token/token
      alertmanagerSpec:
        secrets:
          - alertmanager-ntfy-token
        # Two, so it gossips as a cluster and deduplicates rather than being a
        # single point of failure in front of every alert. AlertmanagerCluster*
        # alerts are meaningless at one replica -- there is no peer to compare
        # against, which is part of why the delivery failure went unnoticed.
        #
        # Prometheus deliberately stays at one: a second replica doubles a 20Gi
        # volume that Longhorn already replicates twice, for duplicate scrapes
        # of the same targets. Alertmanager's state is a few MB of silences.
        replicas: 2
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: 2Gi
        # The memory request is stated rather than left out. Omitting it does
        # not mean "no request": prometheus-operator fills in its own default of
        # 200Mi, which was larger than the 128Mi limit here, so the StatefulSet
        # was rejected outright and Alertmanager never ran at all --
        #   resources.requests: Invalid value: "200Mi": must be less than or
        #   equal to memory limit of 128Mi
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi

    # Dashboards are Perses (observability/perses), which reads this
    # Prometheus directly. Off, the chart also stops rendering its dashboard
    # and datasource ConfigMaps.
    grafana:
      enabled: false

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
        limits:
          # 7d peak 49Mi.
          memory: 160Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 64Mi
