---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    crds:
      enabled: true

    # Talos exposes the control plane metrics endpoints via the patches in
    # talos/patches/controller/cluster.yaml, they are scraped as static endpoints
    # since the components run as static pods outside the Kubernetes API.
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    coreDns:
      enabled: true
    kubeDns:
      enabled: false
    # cilium runs with kubeProxyReplacement, Talos has cluster.proxy.disabled
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: true
      endpoints: &controlPlane
        - 192.168.100.200
        - 192.168.100.201
        - 192.168.100.202
      service:
        enabled: true
        port: 10257
        targetPort: 10257
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      endpoints: *controlPlane
      service:
        enabled: true
        port: 10259
        targetPort: 10259
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeEtcd:
      enabled: true
      endpoints: *controlPlane
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        scheme: http

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 256Mi

    prometheus:
      prometheusSpec:
        replicas: 1
        # Adopt the ServiceMonitors/PodMonitors that already live in this repo
        # (cilium, envoy-gateway, flux-operator, longhorn, echo) instead of only
        # the ones this chart labels itself.
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 18GB
        walCompression: true
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2Gi

    alertmanager:
      alertmanagerSpec:
        replicas: 1
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 128Mi

    grafana:
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      defaultDashboardsTimezone: browser
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
      # Pick up the dashboards shipped by other apps, e.g. cilium sets
      # dashboards.enabled and operator.dashboards.enabled in kube-system.
      sidecar:
        dashboards:
          enabled: true
          labelValue: ""
          searchNamespace: ALL
        datasources:
          enabled: true
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 512Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 64Mi
