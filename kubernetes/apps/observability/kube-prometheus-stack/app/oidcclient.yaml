---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
spec:
  # instanceSelector is omitted: exactly one PocketIDInstance exists, and the
  # operator resolves it cluster-wide, so this client can live here next to
  # Grafana rather than in the security namespace. The Secret it mints lands in
  # this namespace, which is where Grafana needs to read it from.
  callbackUrls:
    - https://grafana.${SECRET_DOMAIN}/login/generic_oauth
  logoutCallbackUrls:
    - https://grafana.${SECRET_DOMAIN}/logout
  pkceEnabled: true
  skipConsent: true
  secret:
    name: grafana-oidc
    keys:
      clientID: client_id
      clientSecret: client_secret
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: grafana-admins
spec:
  # name defaults to metadata.name
  friendlyName: Grafana Admins
