---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  annotations:
    # Flux rewrites ${...} everywhere, ConfigMap contents included, and its
    # envsubst rejects the escaped form outright:
    #   envsubst error: variable substitution failed: unable to parse variable
    #   name
    # Substitution is switched off for this object so the ${...} below survive
    # to be expanded by Gatus from its own environment instead. Everything that
    # needs the domain is passed in as an environment variable by the
    # HelmRelease, where substitution still applies.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  # The sidecar writes discovered endpoints into the same directory as separate
  # files, so this holds only the base configuration. Anything listed here would
  # otherwise have to be maintained by hand for every service.
  config.yaml: |-
    # Matches gatus.port in the HelmRelease.
    web:
      port: 8080
    # No PVC: endpoints are regenerated from the cluster on every start, and
    # history is not worth a ReadWriteOnce volume that pins the pod to a node.
    storage:
      type: memory
    ui:
      title: twenty
      header: twenty
    metrics: true
    # This page lists every service in the cluster and whether it is answering,
    # which is exactly what someone probing would like to read. Published, so it
    # asks who is looking first.
    #
    security:
      oidc:
        issuer-url: ${GATUS_OIDC_ISSUER_URL}
        redirect-url: ${GATUS_OIDC_REDIRECT_URL}
        client-id: ${GATUS_OIDC_CLIENT_ID}
        client-secret: ${GATUS_OIDC_CLIENT_SECRET}
        scopes: [openid]
