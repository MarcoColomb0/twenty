---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  # The sidecar writes discovered endpoints into the same directory as separate
  # files, so this holds only the base configuration. Anything listed here would
  # otherwise have to be maintained by hand for every service.
  config.yaml: |-
    # Matches gatus.port in the HelmRelease. Written literally rather than as
    # the GATUS_WEB_PORT variable Gatus would expand: Flux rewrites that syntax
    # across the whole manifest, ConfigMap contents included, and a variable it
    # does not know becomes an empty string.
    web:
      port: 8080
    # No PVC: endpoints are regenerated from the cluster on every start, and
    # history is not worth a ReadWriteOnce volume that pins the pod to a node.
    storage:
      type: memory
    ui:
      title: twenty
      header: twenty
    metrics: true
