---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  # The sidecar writes discovered endpoints into the same directory as separate
  # files, so this holds only the base configuration. Anything listed here would
  # otherwise have to be maintained by hand for every service.
  config.yaml: |-
    # Matches gatus.port in the HelmRelease. Written literally rather than as
    # the GATUS_WEB_PORT variable Gatus would expand: Flux rewrites that syntax
    # across the whole manifest, ConfigMap contents included, and a variable it
    # does not know becomes an empty string.
    web:
      port: 8080
    # No PVC: endpoints are regenerated from the cluster on every start, and
    # history is not worth a ReadWriteOnce volume that pins the pod to a node.
    storage:
      type: memory
    ui:
      title: twenty
      header: twenty
    metrics: true
    # This page lists every service in the cluster and whether it is answering,
    # which is exactly what someone probing would like to read. Published, so it
    # asks who is looking first.
    #
    # The doubled dollar is deliberate: Flux substitutes ${...} across the whole
    # manifest, so $${...} is what leaves a literal ${...} for Gatus to expand
    # from its own environment at runtime.
    security:
      oidc:
        issuer-url: https://id.${SECRET_DOMAIN}
        redirect-url: https://status.${SECRET_DOMAIN}/authorization-code/callback
        client-id: $${GATUS_OIDC_CLIENT_ID}
        client-secret: $${GATUS_OIDC_CLIENT_SECRET}
        scopes: [openid]
