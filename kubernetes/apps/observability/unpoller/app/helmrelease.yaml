---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
spec:
  chartRef:
    kind: OCIRepository
    name: unpoller
  interval: 1h
  values:
    controllers:
      unpoller:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpoller/unpoller
              tag: v5.9.5
            env:
              # The UniFi Express 7 is the console: it runs UniFi Network
              # itself, so this polls it on the LAN rather than through Site
              # Manager's cloud relay at api.ui.com -- no WAN round trip per
              # poll, no cloud rate limit, and stats survive an internet outage.
              # It serves a self-signed certificate; verify_ssl defaults off.
              UP_UNIFI_DEFAULT_URL: https://192.168.100.1
              # The image bakes the example config into /etc/unpoller/up.conf
              # and env only overrides it. That file enables InfluxDB, which
              # does not exist here.
              UP_INFLUXDB_DISABLE: "true"
              UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:9130
            # UP_UNIFI_DEFAULT_API_KEY: a local key from the console, Network ->
            # Settings -> Control Plane -> Integrations. It takes precedence
            # over the example config's user/pass, which are never sent.
            envFrom:
              - secretRef:
                  name: unpoller-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9130
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # distroless/static's nonroot user
        runAsUser: 65532
        runAsGroup: 65532

    service:
      app:
        controller: unpoller
        ports:
          http:
            port: *port

    serviceMonitor:
      app:
        serviceName: unpoller
        endpoints:
          - port: http
            # unpoller polls the console in the background every 60s and
            # serves /metrics from that cache, so scraping faster only reads
            # the same snapshot again.
            interval: 60s
            scrapeTimeout: 30s
