---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://192.168.100.100:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "192.168.100.100"
  - "twenty.marco.wf"
additionalMachineCertSans: *sans

clusterPodNets:
  - "10.42.0.0/16"
clusterSvcNets:
  - "10.43.0.0/16"

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "twenty-01"
    ipAddress: "192.168.100.200"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/83d43a658b49b2fee28c705f385357d0d73de7f1ee03d304b0ef57ad6dee49c4
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:a5:f0:f7"
        dhcp: false
        addresses:
          - "192.168.100.200/24"
        routes:
          - gateway: "192.168.100.1"
            network: 0.0.0.0/0
        mtu: 1500
        vip:
          ip: "192.168.100.100"

  - hostname: "twenty-virt01"
    ipAddress: "192.168.100.201"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/83d43a658b49b2fee28c705f385357d0d73de7f1ee03d304b0ef57ad6dee49c4
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:46:09:5b"
        dhcp: false
        addresses:
          - "192.168.100.201/24"
        routes:
          - gateway: "192.168.100.1"
            network: 0.0.0.0/0
        mtu: 1500
        vip:
          ip: "192.168.100.100"

  - hostname: "twenty-hp01"
    ipAddress: "192.168.100.202"
    nodeLabels:
      # What Node Feature Discovery would set. The Intel GPU device plugin
      # selects on it, and this is the only node with an iGPU.
      intel.feature.node.kubernetes.io/gpu: "true"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/2494e85a994d8ac77dd6ca30df4a26912a78c8a538b314d42f6aba0eb9187c07
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "b0:0c:d1:53:aa:01"
        dhcp: false
        addresses:
          - "192.168.100.202/24"
        routes:
          - gateway: "192.168.100.1"
            network: 0.0.0.0/0
        mtu: 1500
        vip:
          ip: "192.168.100.100"

# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"
  - "@./patches/global/machine-longhorn.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"
