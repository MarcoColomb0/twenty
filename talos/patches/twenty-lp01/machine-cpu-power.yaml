---
# Energy Performance Preference, the one power lever these boxes actually have.
#
# Both Intel nodes run intel_pstate in active mode with HWP, where the governor
# already reads "powersave" and the real decision is EPP: the hint HWP uses to
# trade frequency against watts. It ships at balance_performance; balance_power
# is one step towards idle, which suits a homelab whose CPUs sit near idle most
# of the day. "power" exists but is a step too far -- it caps turbo hard enough
# to be felt in bursty work like image pulls and helm renders.
#
# Not done with cpufreq.default_governor=powersave. On intel_pstate that is
# already the governor, so it would change nothing here, and on twenty-asus01
# -- acpi-cpufreq, no HWP, no EPP -- "powersave" means pin to the minimum
# frequency forever rather than scale on demand. schedutil there is right.
#
# EPP is per-policy and each core has its own, so every CPU is listed. This node
# is an N150: four of them. Written through sysfs rather than a kernel argument
# because extraKernelArgs only takes effect after a reinstall or a no-op
# upgrade, while these apply on `talosctl apply-config` with no reboot.
machine:
  sysfs:
    devices.system.cpu.cpu0.cpufreq.energy_performance_preference: balance_power
    devices.system.cpu.cpu1.cpufreq.energy_performance_preference: balance_power
    devices.system.cpu.cpu2.cpufreq.energy_performance_preference: balance_power
    devices.system.cpu.cpu3.cpufreq.energy_performance_preference: balance_power
