---
# kube-apiserver, kube-controller-manager, kube-scheduler and kube-proxy moved
# to their own documents in Talos 1.14 -- see kubernetes.yaml. What remains here
# is what v1alpha1 still owns.
cluster:
  allowSchedulingOnControlPlanes: true
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.100.0/24
